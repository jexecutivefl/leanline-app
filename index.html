      arr.splice(i, 1);
      removePlannedFromLog(p, UI.date, e.slotId, e.id);     // LL-619
    }
    save(); closeSheet(); render();
  },

  search(t) { UI.search = t.value; const app = el("app"); const pos = t.selectionStart; render(); const q = el(t.id); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { } } },
  pick(t) { sheetPick(t.dataset.src, t.dataset.id); },
  pkAmt(t) { sheetState.pick.amount = parseFloat(t.value) || 0; updatePickTotal(); },
  pkSet(t) { sheetState.pick.amount = +t.dataset.g; sheetState.pick.estimated = false; el("pkAmt").value = t.dataset.g; updatePickTotal(); },
  pkEstimate() { UI.estimate = !UI.estimate; const pk = sheetState.pick; sheetPick(pk.src, pk.id); },
  pkEst(t) { sheetState.pick.amount = +t.dataset.g; sheetState.pick.estimated = true; el("pkAmt").value = t.dataset.g; updatePickTotal(); },
  pkLog() {
    const pk = sheetState.pick;
    const slotId = el("pkSlot").value;
    const box = el("pkPlan");
    const alsoPlan = !box || !!box.checked;
    const it = pk.byServing ? { source: pk.src, refId: pk.id, servings: pk.amount } : { source: pk.src, refId: pk.id, grams: pk.amount };
    const n = logItems(slotId, [it], pk.estimated ? "estimate" : "search", alsoPlan);
    closeSheet(); UI.tab = "today"; render();
    toast(n ? (alsoPlan ? "Logged and added to the plan" : "Logged") : "Could not log that");
  },
  fav(t) {
    const p = profile(); const id = t.dataset.id;
    S.favorites[p.id] = S.favorites[p.id] || [];
    const i = S.favorites[p.id].indexOf(id);
    if (i >= 0) S.favorites[p.id].splice(i, 1); else S.favorites[p.id].push(id);
    save(); sheetPick("food", id);
  },

  newFood() { sheetFood(null); },
  openFood(t) { sheetFood(t.dataset.id); },
  saveFood(t) {
    const conf = el("fdConf").value;
    const name = el("fdName").value.trim();
    if (!name) { alert("Give it a name."); return; }
    if (!conf) { alert("Choose a confidence state. Every number in this app carries one."); return; }
    const fibRaw = el("fdFib").value.trim();
    const id = t.dataset.id || uid("f");
    const prev = S.foods[id];
    S.foods[id] = {
      id, name,
      per100g: {
        kcal: +el("fdKcal").value || 0, p: +el("fdP").value || 0, c: +el("fdC").value || 0,
        f: +el("fdF").value || 0, fiber: fibRaw === "" ? null : +fibRaw
      },
      confidence: conf, source: el("fdSrc").value.trim(),
      isCustom: prev ? prev.isCustom : true,
      portionHints: prev ? prev.portionHints : [],
      aisle: (el("fdAisle") && el("fdAisle").value) || (prev && prev.aisle) || "Other",
      store: (el("fdStore") && el("fdStore").value) || (prev && prev.store) || DEFAULT_STORE,
      countUnit: prev ? prev.countUnit : undefined,
      liquid: prev ? prev.liquid : undefined,
      pack: prev ? prev.pack : undefined,
      buyAs: prev ? prev.buyAs : undefined,
      perishDays: prev ? prev.perishDays : undefined,
      dense: prev ? prev.dense : undefined, noAtwater: prev ? prev.noAtwater : undefined
    };
    Object.values(S.recipes).forEach(r => computeRecipe(r));
    save(); noteWrite(3); closeSheet(); render(); toast("Saved");
  },

  newRecipe() { sheetRecipe(null); },
  openRecipe(t) { sheetRecipe(t.dataset.id); },
  rcField(t) {
    const r = sheetState.recipe, k = t.dataset.k;
    if (k === "methodText") { r.method = t.value.split("\n").map(s => s.trim()).filter(Boolean); return; }
    if (k === "name") { r.name = t.value; return; }
    const v = t.value.trim() === "" ? null : +t.value;
    r[k] = v;
    if (k === "actualCookedG" || k === "expectedCookedG" || k === "servings") redrawRecipeSheet();
  },
  rcIng(t) {
    const r = sheetState.recipe, i = +t.dataset.i, k = t.dataset.k;
    r.ingredients[i][k] = k === "rawGrams" ? (+t.value || 0) : t.value;
    redrawRecipeSheet();
  },
  rcAddIng() {
    sheetState.recipe.ingredients.push({ foodId: Object.keys(S.foods)[0], rawGrams: 100, note: "" });
    redrawRecipeSheet();
  },
  rcDelIng(t) { sheetState.recipe.ingredients.splice(+t.dataset.i, 1); redrawRecipeSheet(); },
  rcFlag(t) { sheetState.recipe[t.dataset.k] = t.checked; redrawRecipeSheet(); },
  rcRetire() {
    const r = sheetState.recipe; r.retired = !r.retired;
    S.recipes[r.id] = JSON.parse(JSON.stringify(r)); computeRecipe(S.recipes[r.id]);
    save(); closeSheet(); render(); toast(r.retired ? "Retired — nothing deleted" : "Back in the list");
  },
  rcSave() {
    const r = sheetState.recipe;
    if (!r.name.trim()) { alert("Give the recipe a name."); return; }
    const mt = el("rcMethod"); if (mt) r.method = mt.value.split("\n").map(s => s.trim()).filter(Boolean);
    const nm = el("rcName"); if (nm) r.name = nm.value.trim();
    S.recipes[r.id] = JSON.parse(JSON.stringify(r));
    computeRecipe(S.recipes[r.id]);
    save(); noteWrite(5); closeSheet(); UI.foodTab = "recipes"; render(); toast("Recipe saved");
  },

  /* LL-639. Hand the finished week to the other install as a FILE — AirDrop or
     a message does the carrying, the app never opens a socket, and the no-sync
     RESOLVED decision stands. Exports the profile currently shown on the Plan
     screen: one week of that profile's meals plus every recipe and food they
     reference (and the foods those buy as), so the other device can render and
     shop the week even if it has never seen the recipes. */
  shareWeek() {
    const wid = UI.weekStart || (UI.weekStart = weekIdOf(UI.date));
    const pid = planPid(), p = S.profiles[pid];
    if (!p) return;
    const w = S.plans[wid];
    const days = {};
    let n = 0;
    for (const [date, byPid] of Object.entries((w && w.days) || {})) {
      const rows = (byPid[pid] || []).filter(r => r.source !== "empty");
      if (rows.length) { days[date] = rows; n += rows.length; }
    }
    if (!n) { alert("Nothing is planned this week for " + p.name + " — there is nothing to share yet."); return; }
    const foods = {}, recipes = {};
    const addFood = fid => {
      if (!fid || !S.foods[fid] || foods[fid]) return;
      foods[fid] = S.foods[fid];
      if (S.foods[fid].buyAs) addFood(S.foods[fid].buyAs.foodId);
    };
    for (const rows of Object.values(days)) for (const r of rows) {
      if (r.source === "recipe" && S.recipes[r.refId]) {
        if (!recipes[r.refId]) {
          recipes[r.refId] = S.recipes[r.refId];
          for (const ing of S.recipes[r.refId].ingredients || []) addFood(ing.foodId);
        }
      } else if (r.source === "food") addFood(r.refId);
    }
    const payload = { leanline: "week", schemaVersion: S.schemaVersion, exportedAt: new Date().toISOString(),
      weekId: wid, fromProfile: p.name, days, recipes, foods };
    downloadFile("leanline-week-" + wid + "-" + (p.name || "week").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".json",
      JSON.stringify(payload, null, 2), "application/json");
    toast("Week exported — send the file to the other phone and use Import there");
  },

  export(t) {
    const what = t.dataset.what;
    const payload = what === "recipes"
      ? { leanline: "recipes", schemaVersion: S.schemaVersion, exportedAt: new Date().toISOString(), recipes: S.recipes, foods: S.foods }
      : Object.assign({ leanline: "full", exportedAt: new Date().toISOString() }, S);
    downloadFile("leanline-" + what + "-" + isoDate() + ".json",
      JSON.stringify(payload, null, 2), "application/json");
    UI.exportOffer = false; UI.exportDone = true;
    render();
    toast("Exported");
  },
  importSheet() { sheetImport(); },
  exportDismiss() { UI.exportOffer = false; UI.exportDone = true; render(); },
  importFile(t) {
    const f = t.files && t.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { const ta = el("impText"); if (ta) ta.value = rd.result; };
    rd.readAsText(f);
  },
  importText() {
    const raw = el("impText").value.trim();
    if (!raw) { alert("Nothing to import."); return; }
    let data;
    try { data = JSON.parse(raw); } catch (e) { alert("That is not valid JSON."); return; }
    /* LL-639: a shared week lands on the ACTIVE profile — the minor imports on
       his own profile and it becomes his plan. Foods and recipes the week
       needs are added only if missing; nothing already on this device is
       overwritten, so an edited food here keeps its edit. */
    if (data.leanline === "week" && data.weekId && data.days) {
      const p = profile();
      if (!confirm("Import " + (data.fromProfile ? data.fromProfile + "'s" : "this") + " week of " + weekLabel(data.weekId) +
        " into " + p.name + "'s plan? It replaces " + p.name + "'s meals for that week. Recipes and foods it needs are added if missing; nothing of yours is overwritten.")) return;
      for (const [id, f] of Object.entries(data.foods || {})) if (!S.foods[id]) S.foods[id] = JSON.parse(JSON.stringify(f));
      for (const [id, r] of Object.entries(data.recipes || {})) if (!S.recipes[id]) S.recipes[id] = JSON.parse(JSON.stringify(r));
      applyShopping(S.foods);
      Object.values(S.recipes).forEach(r => computeRecipe(r));
      const wid = data.weekId;
      const w = S.plans[wid] = S.plans[wid] || { weekId: wid, batches: [], days: {} };
      let n = 0, dropped = 0;
      for (const [date, rows] of Object.entries(data.days)) {
        const ok = (Array.isArray(rows) ? rows : []).filter(r =>
          r && (r.source === "recipe" ? S.recipes[r.refId] : S.foods[r.refId]));
        dropped += (Array.isArray(rows) ? rows.length : 0) - ok.length;
        w.days[date] = w.days[date] || {};
        w.days[date][p.id] = JSON.parse(JSON.stringify(ok));
        n += ok.length;
      }
      save(); closeSheet(); render();
      toast(n + " meal" + (n === 1 ? "" : "s") + " imported into " + p.name + "'s week" +
        (dropped ? " — " + dropped + " skipped (missing recipe or food)" : ""));
      return;
    }
    if (data.leanline === "recipes" || (data.recipes && !data.profiles)) {
      if (!confirm("Merge these recipes and foods into your data? Nothing existing is deleted.")) return;
      Object.assign(S.foods, data.foods || {});
      Object.assign(S.recipes, data.recipes || {});
      Object.values(S.recipes).forEach(r => computeRecipe(r));
      save(); closeSheet(); render(); toast("Recipes merged");
      return;
    }
    if (!looksLikeState(data)) { alert("This file has no LEANLINE data in it. Nothing has been changed."); return; }
    if (!confirm("Replace everything on this device with this file? Export first if you are unsure.")) return;
    let next = null;
    try { next = migrate(JSON.parse(JSON.stringify(data))); } catch (e) { next = null; }
    if (!looksLikeState(next)) { alert("That file could not be read. Nothing has been changed."); return; }
    S = next; save(); closeSheet(); render(); toast("Imported");
  }
};

/* ---------- delegation ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const tag = t.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  const fn = ACTS[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t); }
});
["input", "change"].forEach(evt => document.addEventListener(evt, e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const tag = t.tagName;
  if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") return;
  if (evt === "input" && (t.type === "checkbox" || tag === "SELECT" || t.type === "file")) return;
  if (evt === "change" && t.type !== "checkbox" && tag !== "SELECT" && t.type !== "file") return;
  const fn = ACTS[t.dataset.act];
  if (fn) fn(t);
}));

/* long-press a slot opens the adjust sheet — tapping the row does too */
let lpTimer = null;
document.addEventListener("pointerdown", e => {
  const t = e.target.closest('[data-act="logSlot"]');
  if (!t) return;
  lpTimer = setTimeout(() => { lpTimer = null; sheetSlot(t.dataset.slot); }, 500);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
  document.addEventListener(ev, () => { clearTimeout(lpTimer); }));

boot();
</script>

<script>
/* Register the cache so the app opens with no network at all after the first
   visit. Same-origin, relative path, no third party. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* stays usable without it */ });
  });
}
</script>
