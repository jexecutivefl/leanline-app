/* ---------- Today ---------- */
function viewToday(p) {
  const d = UI.date;
  const { t, confidence, fiberComplete, count } = dayTotals(p.id, d);
  const tg = p.targets;
  let h = "";

  if (p.provisionalTargets) {
    h += '<div class="banner" role="note"><b>PROVISIONAL TARGETS</b> — pending pediatrician or adolescent sports RD sign-off. ' +
      'An adult clears this from their own profile.</div>';
  }

  h += '<div class="headline"><div class="kcal num">' + num(t.kcal) + '</div>' +
    '<div class="of">of <span class="num">' + num(tg.kcal) + '</span> kcal' +
    (count ? ' · <span class="conf ' + confidence + '">' + confidence.toUpperCase() + '</span>' : '') +
    '</div></div>';

  h += '<div class="gauges">';
  h += gauge("PROTEIN", t.p, tg.protein, "g", true, tg.tracked.protein);
  h += gauge("CARBS", t.c, tg.carbs, "g", false, tg.tracked.carbs);
  h += gauge("FAT", t.f, tg.fat, "g", false, tg.tracked.fat);
  h += gauge("FIBER", t.fiber, tg.fiber, "g", false, tg.tracked.fiber, !fiberComplete);
  h += '</div>';

  if (!fiberComplete) h += '<p class="muted" style="font-size:.875rem;margin:.1rem 0 .4rem">Fiber is a floor, not a total — some foods have no verified fiber data.</p>';

  const left = tg.protein - t.p;
  h += '<p class="oneline">' + (left > 0
    ? '<span class="num">' + R(left) + ' g</span> protein left'
    : 'Protein target met <span class="num">(+' + R(-left) + ' g)</span>') + '</p>';

  // slots
  const nowSlot = currentSlotId(p, d);
  h += '<div style="margin-top:.9rem">';
  const sorted = p.slots.slice().sort((a, b) => {
    const ta = slotTime(a, d), tb = slotTime(b, d);
    if (!ta && !tb) return 0; if (!ta) return 1; if (!tb) return -1;
    return ta < tb ? -1 : 1;
  });
  for (const s of sorted) {
    const entries = logsFor(p.id, d).filter(e => e.slotId === s.id);
    const planned = plannedItems(p, d, s.id).map(resolveItem).filter(Boolean);
    const kcal = entries.length ? entries.reduce((a, e) => a + e.macros.kcal, 0) : planned.reduce((a, i) => a + i.macros.kcal, 0);
    const time = slotTime(s, d) || "——:——";
    const done = entries.length > 0;
    h += '<div class="slotrow"><div class="slotwrap">' +
      '<button class="slot grow' + (done ? " done" : "") + (s.id === nowSlot ? " now" : "") + '" data-act="slotOpen" data-slot="' + s.id + '" ' +
      'aria-label="' + esc(s.name) + ' at ' + esc(time) + ', ' + R(kcal) + ' kcal' + (done ? ', logged' : ', not logged') + '. Adjust or review.">' +
      '<span class="tick" aria-hidden="true">' + (done ? "✓" : "") + '</span>' +
      '<span class="st">' + esc(time) + '</span>' +
      '<span class="sn grow">' + esc(s.name) + '</span>' +
      '<span class="sk">' + R(kcal) + '</span></button>' +
      (done ? "" :
        '<button class="logbtn" data-act="logSlot" data-slot="' + s.id + '" aria-label="Log ' + esc(s.name) + ' at planned macros">' +
        '<span aria-hidden="true">＋</span><span>Log</span></button>') +
      '</div></div>';
  }
  h += '</div>';

  h += '<button class="btn full tall" data-act="tabFood" style="margin-top:.6rem">＋ Log something else</button>';

  // logged entries
  const entries = logsFor(p.id, d);
  if (entries.length) {
    h += '<div class="card" style="margin-top:.9rem"><div class="eyebrow">Logged today</div><div style="margin-top:.5rem">';
    for (const e of entries) {
      h += '<div class="item"><span class="grow"><span class="nm">' + (e.confidence !== "verified" ? "~ " : "") + esc(e.name) +
        '</span><br><span class="sub num">' + (e.grams != null ? R(e.grams) + " g · " : "") + R(e.macros.kcal) + " kcal · " + R1(e.macros.p) + ' g P</span></span>' +
        '<span class="conf ' + e.confidence + '">' + e.confidence.toUpperCase() + '</span>' +
        '<button class="btn sm danger" data-act="unlog" data-id="' + e.id + '">Remove</button></div>';
    }
    h += '</div></div>';
  }
  return h;
}

function gauge(label, val, target, unit, primary, tracked, incomplete) {
  if (tracked === false) return "";
  const over = val > target;
  const fillPct = target > 0 ? Math.min(val / target, 1) * 85 : 0;
  const overPct = over && target > 0 ? Math.min((val - target) / target, 1) * 15 : 0;
  return '<div class="gauge' + (primary ? " primary" : "") + (over ? " over" : "") + '" role="img" aria-label="' +
    esc(label) + ' ' + R(val) + ' of ' + R(target) + ' ' + unit + (over ? ", over target" : "") + '">' +
    '<span class="glabel">' + label + '</span>' +
    '<span class="gtrack"><span class="gfill" data-w="' + fillPct + '"></span>' +
    '<span class="gover" data-w="' + overPct + '" style="left:85%"></span>' +
    '<span class="gtick" style="left:85%"></span></span>' +
    '<span class="gval">' + (incomplete ? "≥" : "") + R(val) + '/' + R(target) + '</span></div>';
}
function paintGauges() {
  document.querySelectorAll(".gfill,.gover").forEach(n => { n.style.width = n.dataset.w + "%"; });
}
function currentSlotId(p, d) {
  if (d !== isoDate()) return null;
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  let best = null, bestDelta = 1e9;
  for (const s of p.slots) {
    const t = slotTime(s, d); if (!t) continue;
    const [hh, mm] = t.split(":").map(Number);
    const delta = mins - (hh * 60 + mm);
    if (delta >= -30 && delta < bestDelta) { bestDelta = delta; best = s.id; }
  }
  return best;
}

/* If the browser refused the app any storage, the fallback is in-memory and
   EVERYTHING is lost when the tab closes. Before this, the only place that was
   said was a line inside Settings — you could log a whole day on a phone and
   lose it without ever being told. This is not dismissible and it is not a
   nudge: it is a statement that the app is currently not saving anything.
   Testing FIX 9c asks for storage fragility stated plainly; on a phone opening
   a local file this is the difference between working and silently discarding
   the day. */
function storageIsVolatile() {
  return !!Store && /in-memory/i.test(Store.kind || "");
}
function viewStorageWarning() {
  if (!storageIsVolatile()) return "";
  return '<div class="banner" role="alert" style="border-width:2px"><b>NOTHING IS BEING SAVED.</b><br>' +
    'This browser will not give the app any storage, so everything you enter disappears when you close this tab. ' +
    'Nothing you have already entered has reached the disk.' +
    '<div style="height:.6rem"></div>' +
    '<button class="btn primary full tall" data-act="export" data-what="all">Export a copy now</button>' +
    '<p class="muted" style="font-size:.8125rem;margin:.45rem 0 0">' +
    'Storage in use: <b class="num">' + esc(Store.kind) + '</b>. ' +
    'On a phone this usually means the file was opened in a way the browser treats as untrusted. ' +
    'Export, then say so — it is fixable, but not from inside the app.</p></div>';
}

/* Testing FIX 9b: after a session with a lot of new data, offer an export
   ONCE. Dismissible, never repeated in the same session, and never framed as
   a failure or a deadline — the point is that a file on his device is the
   only backup that exists, not that he has done something wrong. */
function viewExportOffer() {
  if (!UI.exportOffer) return "";
  return '<div class="card" role="note"><div class="eyebrow">Worth a copy</div>' +
    '<p style="margin:.4rem 0 .6rem;font-size:.9375rem">You have entered a fair amount this session. ' +
    'Everything lives on this device and nowhere else, so an exported file is the only copy there is.</p>' +
    '<div class="two"><button class="btn primary" data-act="export" data-what="all">Export a copy</button>' +
    '<button class="btn" data-act="exportDismiss">Not now</button></div></div>';
}

/* ---------- Onboarding ---------- */
function onbHead(title, sub) {
  const d = UI.onb;
  return '<div class="onbtop"><div class="onbsteps">' +
    Array.from({ length: ONB_STEPS }, (_, i) =>
      '<span class="onbdot' + (i + 1 === d.step ? " on" : (i + 1 < d.step ? " past" : "")) + '"></span>').join("") +
    '</div><p class="muted num" style="font-size:.8125rem;margin:.3rem 0 0">Step ' + d.step + ' of ' + ONB_STEPS + '</p>' +
    '<h2 style="font-size:1.375rem;margin:.5rem 0 .2rem">' + esc(title) + '</h2>' +
    (sub ? '<p class="muted" style="font-size:.9375rem;margin:0">' + esc(sub) + '</p>' : '') + '</div>';
}
/* Which steps gate Next, in one place. onbSync() flips the live button
   against this without re-rendering, so a half-typed number never has to
   survive a DOM rebuild. */
function onbCanNext(d) {
  if (d.step === 1) return !!d.name.trim();
  if (d.step === 2) return onbStep2Problems(d).length === 0;
  return true;
}
function onbNav(nextLabel) {
  const d = UI.onb, can = onbCanNext(d);
  return '<div class="onbnav">' +
    (d.step > 1 ? '<button class="btn" data-act="onbBack">‹ Back</button>' : '<span></span>') +
    '<button class="btn primary tall" id="obNext" data-act="onbNext"' + (can ? '' : ' disabled aria-disabled="true"') + '>' +
    esc(nextLabel || "Next ›") + '</button></div>';
}
/* Typing in a wizard field updates ONLY the two things that depend on it: the
   height readout and the Next button. render() used to run here, which
   destroyed the very input under the thumb and dropped the caret after a
   single digit (LL-618). Nothing in this function touches an input's value. */
function onbSync() {
  const d = UI.onb;
  if (!d) return;
  const cm = el("obCm");
  if (cm) cm.textContent = d.heightCm ? "= " + R1(d.heightCm) + " cm" : "";
  const why = el("obWhy");
  if (why && d.step === 2) {
    /* only complain about a field that has something in it — an empty form is
       not an error, it is an empty form */
    const said = onbStep2Problems(d).filter(x => !/ is needed\.$/.test(x));
    why.textContent = said.join("  ");
  }
  const btn = el("obNext");
  if (btn) {
    const can = onbCanNext(d);
    btn.disabled = !can;
    btn.setAttribute("aria-disabled", can ? "false" : "true");
  }
}

/* LL-624. The picker existed but stopped at 1.3 and lived four cards down a

  if (!s) {
    h += '<button class="btn primary full tall" data-act="sessionStart">Start a session</button>';
    h += viewProgramCard(p);

  /* LL-629: a finished session is a summary, not a form. Reopen restores it. */
  if (s.finishedAt) {
    h += '<div class="card"><div class="eyebrow">' + esc(s.name) + ' · finished</div>';

    h += viewProgramCard(p);

  h += '<div class="card"><div class="eyebrow">' + esc(s.name) + '</div>';
  if (!s.entries.length) h += '<p class="muted" style="margin:.5rem 0 0;font-size:.9375rem">Nothing logged yet.</p>';

function viewExerciseBlock(p, d, e) {
  /* LL-628: a done block collapses to one line. Edit puts it back exactly. */
  if (e.done) {
    return '<div class="exblock"><div class="row"><span class="grow"><b>' + esc(e.exercise) + '</b> <span class="muted" style="font-size:.8125rem">✓ done</span><br>' +
      '<span class="sub num">' + esc(entrySummary(e)) + '</span></span>' +
      '<button class="btn sm" data-act="exDone" data-ex="' + esc(e.exercise) + '" aria-label="Reopen ' + esc(e.exercise) + '">Edit</button></div></div>';
  }
  const prev = previousFor(p.id, d, e.exercise);
  let h = '<div class="exblock"><div class="row"><span class="grow"><b>' + esc(e.exercise) + '</b></span>' +
    '<button class="btn sm" data-act="exDone" data-ex="' + esc(e.exercise) + '" aria-label="Mark ' + esc(e.exercise) + ' done">Done</button>' +
    '<button class="btn sm danger" data-act="exDel" data-ex="' + esc(e.exercise) + '" aria-label="Remove ' + esc(e.exercise) + '">Remove</button></div>';
  if (e.locked) {
    h += '<p class="muted" style="font-size:.75rem;margin:.15rem 0 0;letter-spacing:.06em">OPENS THE SESSION · CANNOT BE MOVED DOWN</p>';
    h += '<p class="muted" style="font-size:.8125rem;margin:.2rem 0 .3rem">' + EXPLOSIVE_MIN + '–' + EXPLOSIVE_MAX +
      ' minutes, low volume, before fatigue. Swap it for another if you prefer:</p>' +
      '<div class="wrap">' + EXPLOSIVE.map(n =>
        '<button class="chipbtn" data-act="exSwap" data-n="' + esc(n) + '" aria-pressed="' + (n === e.exercise) + '">' + esc(n) + '</button>').join("") + '</div>';
  }

  if (e.block) {
    const pd = previousDuration(p.id, d, e.exercise);
    h += pd
      ? '<p class="prev num">Last time ' + esc(fmtDate(pd.date)) + ': ' + R(pd.minutes) + ' min. Ramp it up deliberately, not in one jump.</p>'
      : '<p class="prev muted">First time logging this block. Start where you can finish it.</p>';
  } else {
    h += prev
      ? '<p class="prev num">Last time ' + esc(fmtDate(prev.date)) + ': ' +
        prev.sets.map(x => R(x.lb) + '×' + x.reps).join(", ") + ' — that is the number to beat.</p>'
      : '<p class="prev muted">First time logging this one.</p>';
  }

  if (e.sets.length) {
    h += '<table class="mono-table" style="margin-top:.3rem"><tbody>';
    e.sets.forEach((x, i) => {
      h += '<tr><td>Set ' + (i + 1) + '</td><td>' + R(x.lb) + ' lb × ' + x.reps + (x.rpe ? ' · RPE ' + R1(x.rpe) : '') + '</td>' +
        '<td><button class="btn sm danger" data-act="setDel" data-ex="' + esc(e.exercise) + '" data-i="' + i + '" aria-label="Remove set ' + (i + 1) + '">✕</button></td></tr>';
    });
    h += '</tbody></table>';
  }
  const sid = e.exercise.replace(/[^a-z0-9]/gi, "_");
  if (!e.block) h += '<div class="three" style="margin-top:.4rem">' +
    '<div class="field"><label for="rp_' + sid + '">Reps</label><input id="rp_' + sid + '" type="number" inputmode="numeric" min="1" step="1"></div>' +
    '<div class="field"><label for="lb_' + sid + '">Weight lb</label><input id="lb_' + sid + '" type="number" inputmode="decimal" min="0" step="2.5"' +
    (prev ? ' placeholder="' + R(prev.sets[prev.sets.length - 1].lb) + '"' : '') + '></div>' +
    '<div class="field"><label for="re_' + sid + '">RPE</label><input id="re_' + sid + '" type="number" inputmode="decimal" min="1" max="10" step="0.5" placeholder="optional"></div>' +
    '</div><button class="btn full" data-act="setAdd" data-ex="' + esc(e.exercise) + '" data-sid="' + sid + '">Add set</button>';
  if (e.minutes !== undefined) {
    h += '<div class="field" style="margin-top:' + (e.block ? '.4rem' : '.5rem') + '"><label for="mn_' + sid + '">Minutes</label>' +
      '<input id="mn_' + sid + '" type="number" inputmode="numeric" min="0" step="1" value="' + (e.minutes == null ? "" : e.minutes) + '" ' +
      'data-act="exMinutes" data-ex="' + esc(e.exercise) + '"></div>';
  }
  h += '</div>';
  return h;
}

/* Program card. For a minor it will not generate anything until the school
   question is answered, and it never re-asks once it is on record. */
function viewProgramCard(p) {
  const t = trainingOf(p.id);
  let h = '<div class="card"><div class="eyebrow">Program</div>';

  if (p.isMinor && !schoolAnswered(p)) {
    h += '<p style="margin:.5rem 0 .4rem"><b>First: does your school run a strength programme?</b></p>' +
      '<p class="muted" style="font-size:.875rem;margin:0 0 .6rem">Nothing is generated until this is answered. If the school runs one, that programme is primary and this app reduces its own volume instead of stacking a second one on top.</p>' +
      '<div class="two"><button class="btn" data-act="schoolYes">Yes, school runs one</button>' +
      '<button class="btn" data-act="schoolNo">No weights at school</button></div></div>';
    return h;
  }

  if (p.isMinor) {
    const sc = p.schoolSC;
    h += sc.exists
      ? '<p style="margin:.4rem 0 .3rem"><b>Your school&rsquo;s programme is primary.</b></p>' +
        '<p class="muted" style="font-size:.875rem;margin:0 0 .5rem">Recorded ' + esc(fmtDate(sc.recordedOn)) + '. This app suggests ' +
        SUPPLEMENTAL_DAYS + ' days rather than ' + MINOR_SPLIT.length + ', so it supplements rather than stacks. ' +
        'That number is this app&rsquo;s default — check it with your strength staff.</p>'
      : '<p style="margin:.4rem 0 .3rem"><b>No school weight programme. This one is primary.</b></p>' +
        '<p class="muted" style="font-size:.875rem;margin:0 0 .5rem">Recorded ' + esc(fmtDate(sc.recordedOn)) +
        '. Because there is nothing at school, this has to be a complete programme rather than accessory work — and supervision is the load-bearing part of that.</p>';
  }

  if (!t.program.length) {
    h += '<button class="btn full" data-act="progMake">Suggest a program</button></div>';
    return h;
  }
  const unconfirmed = t.program.filter(x => x.dayOfWeek == null);
  h += '<table class="mono-table" style="margin-top:.3rem"><tbody>';
  t.program.forEach((d, i) => {
    h += '<tr><td>' + esc(d.name) + (d.supplemental ? ' <span class="sub">· supplemental</span>' : '') +
      (d.dayOfWeek == null ? '<br><span class="sub warn">unconfirmed</span>' : '') + '</td>' +
      '<td style="min-width:8rem"><select data-act="progDay" data-i="' + i + '" aria-label="Weekday for ' + esc(d.name) + '">' +
      '<option value=""' + (d.dayOfWeek == null ? " selected" : "") + '>— not set —</option>' +
      DAYS.map((n, w) => '<option value="' + w + '"' + (d.dayOfWeek === w ? " selected" : "") + '>' + n + '</option>').join("") +
      '</select></td></tr>';
  });
  h += '</tbody></table>';
  if (unconfirmed.length) h += '<p class="muted" style="font-size:.8125rem;margin:.4rem 0 0">' +
    unconfirmed.length + ' of these have no weekday yet. No document states them, so none has been invented — set them in Settings.</p>';
  h += '<div style="height:.5rem"></div><button class="btn full" data-act="progMake">Re-suggest</button></div>';
  return h;
}

function viewTrainHistory(p) {
  const past = trainingOf(p.id).sessions.filter(s => s.date < UI.date).sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 5);
  if (!past.length) return "";
  let h = '<div class="card"><div class="eyebrow">Recent sessions</div><div style="margin-top:.5rem">';
  for (const s of past) {
    h += '<div class="item"><span class="grow"><span class="nm">' + esc(s.name) + '</span><br><span class="sub num">' +
      esc(fmtDate(s.date)) + ' · ' + (s.entries || []).map(e => esc(e.exercise) + " " + e.sets.length + "×").join(", ") + '</span></span></div>';
  }
  h += '</div></div>';
  return h;
}

function sheetAddExercise() {
  const p = profile();
  const sched = scheduledFor(p.id, UI.date);
  const known = knownExercises(p.id);
  let h = sheetHead("Add an exercise", "Type anything. The program is a suggestion, not a list of what is allowed.");
  h += '<div class="field"><label for="exName">Exercise</label><input id="exName" list="exList" placeholder="Squat, Chin-up, Get-off starts…">' +
    '<datalist id="exList">' + known.concat(sched.map(x => x.name)).map(n => '<option value="' + esc(n) + '"></option>').join("") + '</datalist></div>';
  if (known.length) h += '<div class="wrap" style="margin-top:.5rem">' +
    known.slice(0, 8).map(n => '<button class="chipbtn" data-act="exPick" data-n="' + esc(n) + '">' + esc(n) + '</button>').join("") + '</div>';
  if (p.isMinor) h += '<div class="rule"></div><div class="eyebrow">Defensive end — supplemental</div>' +
    '<div class="wrap" style="margin-top:.4rem">' +
    DE_SUPPLEMENTAL.map(n => '<button class="chipbtn" data-act="exPick" data-n="' + esc(n) + '">' + esc(n) + '</button>').join("") + '</div>';
  h += '<div style="height:.7rem"></div><button class="btn primary full tall" data-act="exSave">Add it</button>';
  openSheet(h);
}

/* ---------- Progress (spec §4.5) ---------- */
function viewProgress(p) {
  let h = "";
  if (p.provisionalTargets) {
    h += '<div class="banner" role="note"><b>PROVISIONAL TARGETS</b> — pending pediatrician or adolescent sports RD sign-off. ' +
      'An adult clears this from their own profile.</div>';
  }
  if (p.isMinor) {
    /* Panel §2 RESOLVED: the number he chases is the barbell, not the scale.
       Lifts lead; weight is a secondary chart with no goal line and no
       countdown anywhere on the screen. */
    h += viewLiftChart(p);
    h += viewGrowthCheckIn(p);
    h += viewMinorWeightChart(p);
  } else {
    h += viewCheckIn(p);
    h += viewTrendChart(p);
    h += viewSecondary(p);
  }
  h += viewMetricsEntry(p);
  h += viewMetricsHistory(p);
  return h;
}

/* the adult's secondary row: protein hit rate and top-set progression.
   Adherence is deliberately NOT here — Panel §4 puts it in the check-in only. */
function viewSecondary(p) {
  const hr = proteinHitRate(p.id, UI.date);
  const prog = topSetProgression(p.id, UI.date);
  let h = '<div class="card"><div class="eyebrow">Protein hit rate</div>';
  if (!hr || !hr.logged) {
    h += '<p class="muted" style="margin:.5rem 0 0;font-size:.9375rem">Not enough data. Nothing logged in the last ' + HIT_RATE_DAYS + ' days.</p>';
  } else {
    h += '<p style="margin:.5rem 0 0;font-size:1.125rem"><span class="num">' + hr.hit + ' of ' + hr.logged +
      '</span> logged days at or above <span class="num">' + hr.target + ' g</span></p>' +
      '<p class="muted" style="font-size:.8125rem;margin:.3rem 0 0">Trailing ' + HIT_RATE_DAYS +
      ' days. Days with nothing logged are not counted either way.</p>';
  }
  h += '</div>';

  h += '<div class="card"><div class="eyebrow">Top sets</div>';
  if (!prog.length) {
    h += '<p class="muted" style="margin:.5rem 0 0;font-size:.9375rem">Not enough data. Two sessions of the same lift, logged on Train, and the progression appears.</p>';
  } else {
    h += '<table class="mono-table" style="margin-top:.4rem"><thead><tr><th>Lift</th><th>Now</th><th>Change</th></tr></thead><tbody>';
    for (const x of prog) {
      const change = x.deltaLb ? (x.deltaLb > 0 ? "+" : "−") + R(Math.abs(x.deltaLb)) + " lb"
        : (x.deltaReps ? (x.deltaReps > 0 ? "+" : "−") + Math.abs(x.deltaReps) + " reps" : "level");
      h += '<tr><td>' + esc(x.exercise) + '<br><span class="sub">' + x.sessions + ' sessions since ' + esc(fmtDate(x.first.date)) + '</span></td>' +
        '<td>' + R(x.last.lb) + ' × ' + x.last.reps + '</td><td>' + change + '</td></tr>';
    }
    h += '</tbody></table>';
  }
  h += '</div>';
  return h;
}

/* the minor's headline. Top-set weight per lift over time. */
function viewLiftChart(p) {
  const sets = topSets(p.id, UI.date, 365);
  const names = Object.keys(sets).filter(k => sets[k].length >= 2);
  let h = '<div class="card"><div class="eyebrow">Lifts</div>';
  if (!names.length) {
    h += '<p class="muted" style="margin:.5rem 0 0;font-size:.9375rem">Not enough data yet. Two sessions of the same lift, logged on Train, and the line starts.</p></div>';
    return h;
  }
  const all = names.flatMap(k => sets[k]);
  const dates = all.map(x => x.date).sort();
  const y = extent(all.map(x => x.lb));
  const sc = chartScales(dates, y, null);
  h += '<svg class="chart" viewBox="0 0 ' + CH.w + ' ' + CH.h + '" role="img" aria-label="Top set weight per lift, ' +
    esc(names.join(", ")) + ', from ' + esc(fmtDate(dates[0])) + ' to ' + esc(fmtDate(dates[dates.length - 1])) + '">';
  h += '<line class="ax" x1="' + CH.l + '" y1="' + (CH.h - CH.b) + '" x2="' + (CH.w - CH.r) + '" y2="' + (CH.h - CH.b) + '"/>';
  const dashes = ["", "5 3", "2 2", "8 3", "1 3"];
  names.forEach((k, i) => {
    const pts = sets[k].map(x => ({ date: x.date, v: x.lb }));
    h += polyline(pts, sc, sc.a, "ln lift", dashes[i % dashes.length]);
    h += pts.map(pt => '<circle class="dot" cx="' + R1(sc.x(pt.date)) + '" cy="' + R1(sc.a(pt.v)) + '" r="2.5"/>').join("");
  });
  h += '<text class="axl" x="2" y="' + (CH.t + 8) + '">' + R1(y[1]) + '</text>' +
    '<text class="axl" x="2" y="' + (CH.h - CH.b) + '">' + R1(y[0]) + '</text>' +
    '<text class="axl" x="' + CH.l + '" y="' + (CH.h - 6) + '">' + esc(fmtDate(dates[0])) + '</text>' +
    '<text class="axl ar" x="' + (CH.w - CH.r) + '" y="' + (CH.h - 6) + '">' + esc(fmtDate(dates[dates.length - 1])) + '</text>';
  h += '</svg>';
  h += names.map((k, i) => {
    const a = sets[k], first = a[0], last = a[a.length - 1];
    const up = last.lb - first.lb;
    return '<div class="row"><span class="grow num legend"><span class="sw" style="border-top-style:' +
      (i === 0 ? "solid" : "dashed") + '"></span>' + esc(k) + ' — ' + R(last.lb) + ' lb × ' + last.reps +
      (up ? ' · ' + (up > 0 ? "+" : "−") + R(Math.abs(up)) + ' lb since ' + esc(fmtDate(first.date)) : ' · same weight as ' + esc(fmtDate(first.date))) +
      '</span></div>';
  }).join("");
  h += '</div>';
  return h;
}

function viewGrowthCheckIn(p) {
  const r = growthCall(p.id, UI.date);
  let h = '<div class="card"><div class="eyebrow">Weekly check-in · ' + esc(fmtDate(UI.date)) + '</div>';
  if (!r.ready) {
    h += '<p style="margin:.5rem 0 .4rem"><b>Not enough data.</b> No call is computed.</p>' +
      '<ul style="margin:.3rem 0 0;padding-left:1.1rem;font-size:.9375rem">' +
      r.missing.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul></div>';
    return h;
  }
  h += '<p style="margin:.5rem 0 .3rem;font-size:1.125rem"><b>' + esc(r.call) + '</b></p>' +
    '<p style="margin:0 0 .5rem;font-size:.9375rem">' + esc(r.reason) + '</p>' +
    '<table class="mono-table"><tbody><tr><td>Weight trend</td><td>' +
    (r.rate >= 0 ? "+" : "−") + R1(Math.abs(r.rate)) + ' lb/wk</td></tr>' +
    '<tr><td>Top sets</td><td>' + (r.lifts.known ? r.lifts.dir : "not logged yet") + '</td></tr></tbody></table>' +
    '<p class="muted" style="font-size:.8125rem;margin:.5rem 0 0">Flat means inside ' + MINOR_FLAT_LB_WK +
    ' lb a week, which is the bottom of the 0.25 to 0.5 band this plan aims at. That threshold is this app&rsquo;s, not the protocol&rsquo;s. ' +
    'Some of any gain at fifteen is growth rather than training.</p></div>';
  return h;
}

/* Secondary. No goal line, no countdown, no weight-to-go — Panel §2. */
function viewMinorWeightChart(p) {
  const m = metricsOf(p.id);
  const pts = m.weight.map(w => ({ date: w.date, v: w.lb }));
  let h = '<div class="card"><div class="eyebrow">Weight</div>';
  if (pts.length < 2) {
    h += '<p class="muted" style="margin:.5rem 0 0;font-size:.9375rem">' +
      (pts.length ? "One weigh-in so far." : "No weigh-ins yet.") + '</p></div>';
    return h;
  }
  const dates = pts.map(x => x.date).sort();
  const y = extent(pts.map(x => x.v));
  const sc = chartScales(dates, y, null);
  h += '<svg class="chart" viewBox="0 0 ' + CH.w + ' ' + CH.h + '" role="img" aria-label="Weight in pounds from ' +
    esc(fmtDate(dates[0])) + ' to ' + esc(fmtDate(dates[dates.length - 1])) + '">';
  h += '<line class="ax" x1="' + CH.l + '" y1="' + (CH.h - CH.b) + '" x2="' + (CH.w - CH.r) + '" y2="' + (CH.h - CH.b) + '"/>';
  h += polyline(pts, sc, sc.a, "ln wt");
  h += pts.map(pt => '<circle class="dot" cx="' + R1(sc.x(pt.date)) + '" cy="' + R1(sc.a(pt.v)) + '" r="2.5"/>').join("");
  h += '<text class="axl" x="2" y="' + (CH.t + 8) + '">' + R1(y[1]) + '</text>' +
    '<text class="axl" x="2" y="' + (CH.h - CH.b) + '">' + R1(y[0]) + '</text>' +
    '<text class="axl" x="' + CH.l + '" y="' + (CH.h - 6) + '">' + esc(fmtDate(dates[0])) + '</text>' +
    '<text class="axl ar" x="' + (CH.w - CH.r) + '" y="' + (CH.h - 6) + '">' + esc(fmtDate(dates[dates.length - 1])) + '</text>';
  h += '</svg><p class="muted" style="font-size:.8125rem;margin:.4rem 0 0">Once a week, same day, same conditions.</p></div>';
  return h;
}

/* Weekly check-in. Adherence appears HERE and nowhere else in the app,
   framed as days, never as a score (Panel §4 RESOLVED). */
function viewCheckIn(p) {
  const end = UI.date;
  const r = recompCall(p.id, end);
  let h = '<div class="card"><div class="eyebrow">Weekly check-in · ' + esc(fmtDate(end)) + '</div>';

  if (!r.ready) {
    h += '<p style="margin:.5rem 0 .4rem"><b>Not enough data.</b> No call is computed.</p>' +
      '<p class="muted" style="font-size:.875rem;margin:0">Still needed:</p><ul style="margin:.3rem 0 0;padding-left:1.1rem;font-size:.9375rem">' +
      r.missing.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>';
    if (r.adh && r.adh.logged) h += adherenceLine(r.adh);
    h += '</div>';
    return h;
  }

  h += '<p style="margin:.5rem 0 .3rem;font-size:1.125rem"><b>' + esc(r.call) + '</b></p>' +
    '<p style="margin:0 0 .5rem;font-size:.9375rem">' + esc(r.reason) + '</p>' +
    '<table class="mono-table"><tbody>' +
    '<tr><td>Weight trend</td><td>' + (r.wRate >= 0 ? "+" : "−") + R1(Math.abs(r.wRate)) + ' lb/wk · ' + r.w + '</td></tr>' +
    '<tr><td>Waist</td><td>' + (r.waistDelta >= 0 ? "+" : "−") + R1(Math.abs(r.waistDelta)) + ' in · ' + r.wa + '</td></tr>' +
    '<tr><td>Top sets</td><td>' + r.li + (r.lifts.moved && r.lifts.moved.length ? ' · ' + esc(r.lifts.moved.join(", ")) : '') + '</td></tr>' +
    '</tbody></table>';
  h += adherenceLine(r.adh);
  h += '<p class="muted" style="font-size:.8125rem;margin:.5rem 0 0">Flat means inside ' + FLAT_LB_WK +
    ' lb a week on the trend and ' + FLAT_WAIST_IN + ' in on the tape. Those thresholds are this app&rsquo;s, not the protocol&rsquo;s — ' +
    'they are the point below which the reading is noise.</p>';
  h += '</div>';
  return h;
}
function adherenceLine(adh) {
  return '<p class="muted" style="font-size:.875rem;margin:.5rem 0 0">Adherence: <span class="num">' +
    adh.onTarget + ' of 7</span> days inside 10% of the kcal target' +
    (adh.logged < 7 ? ' · <span class="num">' + adh.logged + '</span> days logged' : '') + '.</p>';
}

/* the adult's headline: weight rolling average + waist, one chart, dual axis.
   NOTHING on this screen shows a single-day change (Panel §7 RESOLVED). */
function viewTrendChart(p) {
  const m = metricsOf(p.id);
  const raw = m.weight.map(w => ({ date: w.date, v: w.lb }));
  const waist = m.waist.map(w => ({ date: w.date, v: w.in }));
  let h = '<div class="card"><div class="eyebrow">Weight and waist</div>';
  if (raw.length < 2) {
    h += '<p class="muted" style="margin:.5rem 0 0;font-size:.9375rem">' +
      (raw.length ? "One weigh-in so far. The trend line starts at two." : "No weigh-ins yet.") + '</p></div>';
    return h;
  }
  const avg = rollingAverage(raw, ROLL_DAYS);
  const dates = raw.map(r => r.date).concat(waist.map(w => w.date)).sort();
  const yW = extent(raw.map(r => r.v).concat(avg.map(a => a.v)));
  const yA = waist.length ? extent(waist.map(w => w.v)) : null;
  const sc = chartScales(dates, yW, yA);

  h += '<svg class="chart" viewBox="0 0 ' + CH.w + ' ' + CH.h + '" role="img" ' +
    'aria-label="Weight ' + ROLL_DAYS + '-day rolling average' + (waist.length ? ' and waist' : '') +
    ' from ' + esc(fmtDate(dates[0])) + ' to ' + esc(fmtDate(dates[dates.length - 1])) + '">';
  h += '<line class="ax" x1="' + CH.l + '" y1="' + (CH.h - CH.b) + '" x2="' + (CH.w - CH.r) + '" y2="' + (CH.h - CH.b) + '"/>';
  /* raw dailies, faint, behind the average */
  h += raw.map(r => '<circle class="dot" cx="' + R1(sc.x(r.date)) + '" cy="' + R1(sc.a(r.v)) + '" r="2"/>').join("");
  h += polyline(avg, sc, sc.a, "ln wt");
  if (waist.length && sc.b) h += polyline(waist, sc, sc.b, "ln wa", "5 3");
  h += '<text class="axl" x="2" y="' + (CH.t + 8) + '">' + R1(yW[1]) + '</text>' +
    '<text class="axl" x="2" y="' + (CH.h - CH.b) + '">' + R1(yW[0]) + '</text>';
  /* class 'ry' marks the RIGHT-HAND VALUE axis — only the dual-axis chart has one */
  if (yA) h += '<text class="axl ar ry" x="' + (CH.w - 2) + '" y="' + (CH.t + 8) + '">' + R1(yA[1]) + '</text>' +
    '<text class="axl ar ry" x="' + (CH.w - 2) + '" y="' + (CH.h - CH.b) + '">' + R1(yA[0]) + '</text>';
  h += '<text class="axl" x="' + CH.l + '" y="' + (CH.h - 6) + '">' + esc(fmtDate(dates[0])) + '</text>' +

/* ---------- Plan  (spec §4.2 — the dense screen; Panel §5 RESOLVED) ---------- */
function planPid() {

}
/* Planned totals for a whole day — the Plan footer. Distinct from dayTotals(),
   which sums what was actually LOGGED. */
function dayPlanTotals(p, dateStr) {
  const t = ZERO(); const confs = []; let fiberComplete = true, n = 0;
  for (const s of p.slots) {
    for (const it of plannedItems(p, dateStr, s.id)) {
      const r = resolveItem(it);
      if (!r) continue;
      addTo(t, r.macros); confs.push(r.confidence);
      if (!r.fiberKnown) fiberComplete = false;
      n++;
    }
  }
  return { t, n, fiberComplete, confidence: confs.length ? weakest(confs) : "verified" };
}
/* Signed text delta — over and under must not be colour alone (Panel §10). */
function deltaText(val, target) {
  if (!(target > 0)) return "";
  const d = val - target;
  if (Math.abs(d) < 0.5) return "on target";
  return (d > 0 ? "+" : "−") + R(Math.abs(d)) + (d > 0 ? " over" : " under");
}

function slotTotals(p, dateStr, slotId) {
  const t = ZERO(); const confs = []; let fiberComplete = true, n = 0;
  for (const it of plannedItems(p, dateStr, slotId)) {
    const r = resolveItem(it);
    if (!r) continue;
    addTo(t, r.macros); confs.push(r.confidence);
    if (!r.fiberKnown) fiberComplete = false;
    n++;
  }
  return { t, n, fiberComplete, confidence: confs.length ? weakest(confs) : "verified" };
}

/* ============================================================
   PROGRESS — metrics entry (LL-301)
   Spec §4.5, Panel §2 RESOLVED, Instructions §9.
   Every guardrail here is enforced in code and asserted in tools/smoke.mjs.
   ============================================================ */

/* Panel §2: "Weigh-in capped at once per week in code. The input is disabled
   otherwise." Not a hint, not a warning — the control does not accept input. */
const WEIGH_GAP_DAYS = 7;
function lastEntry(list) {
  if (!list || !list.length) return null;
  return list.slice().sort((a, b) => (a.date < b.date ? -1 : 1))[list.length - 1];
}
function nextWeighInDate(pid) {
  const p = S.profiles[pid];
  if (!p || !p.isMinor) return null;
  const last = lastEntry((S.metrics[pid] || {}).weight);
  return last ? shiftDate(last.date, WEIGH_GAP_DAYS) : null;
}
function canWeighIn(pid) {
  const next = nextWeighInDate(pid);
  return !next || isoDate() >= next;
}

/* Spec §5 + Panel §2: a minor's profile cannot enter a deficit state. `cut`
   is not an option the UI can offer, and setTarget() refuses a figure below
   the estimated TDEE. Both are asserted in tools/smoke.mjs. */
const GOAL_MODES = ["cut", "recomp", "maintain", "gain"];
function goalModesFor(p) { return p && p.isMinor ? GOAL_MODES.filter(g => g !== "cut") : GOAL_MODES.slice(); }

/* The waist is a leanness measurement. the minor's protocol (Instructions §9)
   does not use one, and Panel §9 resolves anything ambiguous toward LESS
   measurement for a minor, so the field is not offered on his profile. */
function waistAllowed(pid) { return !(S.profiles[pid] || {}).isMinor; }

/* Distress language. A deliberately narrow phrase list — single words like
   "fat" appear in ordinary macro talk every day, so only phrases match.
   Heuristic, and it errs toward silence rather than toward pestering. */
const DISTRESS = [
  "hate my body", "hate how i look", "hate the way i look", "hate my stomach",
  "too fat", "so fat", "i'm fat", "im fat", "feel fat", "look fat",
  "disgusting", "worthless", "hate myself",
  "starve", "starving myself", "stop eating", "not eating", "skip meals", "skipping meals",
  "throw up", "throwing up", "purge", "purging", "make myself sick",
  "want to be skinny", "scared to eat", "afraid to eat", "guilty about eating", "hate eating"
];
function hasDistress(text) {
  const t = String(text || "").toLowerCase();
  return DISTRESS.some(p => t.includes(p));
}
/* One line. Nothing else — no resource list, no follow-up question, and no
   record anywhere that the phrase was seen (Panel §2). */
function distressLine(pid) {
  return (S.profiles[pid] || {}).isMinor
    ? "This is a conversation for your dad and your doctor."
    : "This is a conversation for you and your doctor.";
}

/* ---- charts (LL-302) ---------------------------------------
   Hand-rolled SVG. Constraint 1 forbids a chart library, and a library
   would be a network fetch or a bundle step either way.

   Panel §7 RESOLVED: weight is shown as a 7-day rolling average with the raw
   dailies as faint dots behind it, waist on the same chart with its own axis.
   Testing FIX 7: a gap in the data renders as a gap, with no annotation.
   ------------------------------------------------------------ */
const ROLL_DAYS = 7;
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }

/* Trailing N-day mean at each observation. A window with one reading in it
   returns that reading — an average of one is still that number. */
function rollingAverage(points, days) {
  const src = points.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  return src.map(p => {
    const win = src.filter(q => q.date <= p.date && daysBetween(q.date, p.date) < (days || ROLL_DAYS));
    return { date: p.date, v: win.reduce((a, q) => a + q.v, 0) / win.length, n: win.length };
  });
}
/* Split a series wherever the gap is wider than the averaging window, so a
   month away from the scale draws as a break instead of a straight line
   pretending nothing happened. */
function splitOnGaps(points, maxGap) {
  const out = []; let run = [];
  for (const p of points) {
    if (run.length && daysBetween(run[run.length - 1].date, p.date) > (maxGap || ROLL_DAYS)) { out.push(run); run = []; }
    run.push(p);
  }
  if (run.length) out.push(run);
  return out;
}
function extent(vals, pad) {
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (!(hi > lo)) { hi = lo + 1; lo = lo - 1; }
  const p = (hi - lo) * (pad == null ? 0.12 : pad);
  return [lo - p, hi + p];
}
const CH = { w: 320, h: 180, l: 34, r: 34, t: 12, b: 24 };
function chartScales(dates, yA, yB) {
  const d0 = parseISO(dates[0]), d1 = parseISO(dates[dates.length - 1]);
  const span = Math.max(1, (d1 - d0) / 86400000);
  const x = ds => CH.l + (daysBetween(dates[0], ds) / span) * (CH.w - CH.l - CH.r);
  const mk = (lo, hi) => v => CH.h - CH.b - ((v - lo) / (hi - lo)) * (CH.h - CH.t - CH.b);
  return { x, a: yA ? mk(yA[0], yA[1]) : null, b: yB ? mk(yB[0], yB[1]) : null };
}
function polyline(pts, sc, yfn, cls, dash) {
  return splitOnGaps(pts).map(run =>
    '<polyline class="' + cls + '" fill="none" points="' +
    run.map(p => R1(sc.x(p.date)) + "," + R1(yfn(p.v))).join(" ") + '"' +
    (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' />').join("");
}

/* ---- weekly check-in (LL-303 / LL-304) ---------------------
   Instructions §9. The protocol tables are implemented literally; the only
   things this file adds are the thresholds that decide what "flat" means,
   because no document states one.

   THRESHOLDS, and why:
     weight  0.5 lb/week — the adult's own expected rate is 1.1–1.6 lb/wk
                           (01_PROFILES). A third of the low end is
                           indistinguishable from water and sodium.
     waist   0.25 in     — about the best a tape repeats at, same spot,
                           same tension.
     lifts   any increase in a top set counts as up.
   These are LEANLINE's numbers, not the documents'. They are stated on
   screen so a call can be argued with.
   ------------------------------------------------------------ */
const FLAT_LB_WK = 0.5, FLAT_WAIST_IN = 0.25;
const CHECKIN_WINDOW = 14;      // days of weigh-ins the trend is fitted over

function inWindow(list, endDate, days) {
  return (list || []).filter(x => x.date <= endDate && daysBetween(x.date, endDate) < days);
}
/* Least-squares slope in units per week. Uses the readings themselves rather
   than first-and-last, so one odd morning cannot set the direction. */
function slopePerWeek(points) {
  if (!points || points.length < 2) return null;
  const t0 = points[0].date;
  const xs = points.map(p => daysBetween(t0, p.date)), ys = points.map(p => p.v);
  const n = xs.length;
  const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
  if (!den) return null;
  return (num / den) * 7;
}
function dir(delta, flat) { return delta <= -flat ? "down" : (delta >= flat ? "up" : "flat"); }

/* Adherence: days on target ÷ 7 (Instructions §9). "On target" is within 10%
   of the kcal target — the same 10% the daily rule uses to decide whether
   anything is worth saying at all. */
function adherence(pid, endDate) {
  const p = S.profiles[pid], target = p.targets.kcal;
  if (!(target > 0)) return null;
  let onTarget = 0, logged = 0;
  for (let i = 0; i < 7; i++) {
    const d = shiftDate(endDate, -i);
    const t = dayTotals(pid, d);
    if (!t.count) continue;
    logged++;
    if (Math.abs(t.t.kcal - target) / target <= 0.10) onTarget++;
  }
  return { onTarget, logged, pct: onTarget / 7 * 100 };
}

/* Top set = the heaviest single set logged for an exercise in a session. */
function topSets(pid, endDate, days) {
  const sessions = ((S.training[pid] || {}).sessions || [])
    .filter(s => s.date <= endDate && daysBetween(s.date, endDate) < days);
  const out = {};
  for (const s of sessions)
    for (const e of (s.entries || [])) {
      const best = (e.sets || []).reduce((a, x) => (x.lb > (a ? a.lb : -1) ? x : a), null);
      if (!best) continue;
      const k = e.exercise;
      (out[k] = out[k] || []).push({ date: s.date, lb: best.lb, reps: best.reps });
    }
  for (const k of Object.keys(out)) out[k].sort((a, b) => (a.date < b.date ? -1 : 1));
  return out;
}
function liftsDirection(pid, endDate) {
  const sets = topSets(pid, endDate, CHECKIN_WINDOW);
  const names = Object.keys(sets).filter(k => sets[k].length >= 2);
  if (!names.length) return { known: false, dir: null, moved: [] };
  const moved = names.filter(k => {
    const a = sets[k], first = a[0], last = a[a.length - 1];
    return last.lb > first.lb || (last.lb === first.lb && last.reps > first.reps);
  });
  return { known: true, dir: moved.length ? "up" : "flat", moved, names };
}

function checkInInputs(pid, endDate) {
  const m = metricsOf(pid);
  const weighIns = inWindow(m.weight.map(w => ({ date: w.date, v: w.lb })), endDate, CHECKIN_WINDOW);
  const waists = inWindow(m.waist.map(w => ({ date: w.date, v: w.in })), endDate, 60);
  const lifts = liftsDirection(pid, endDate);
  const adh = adherence(pid, endDate);
  const missing = [];
  if (weighIns.length < 4) missing.push("weigh-ins — " + weighIns.length + " of the 4 this needs");
  if (waists.length < 2) missing.push(waists.length
    ? "waist — one measurement so far, a second is what makes a direction"
    : "waist — no measurement yet");
  if (!lifts.known) missing.push("top-set lifts — two sessions of the same lift, logged on Train");
  if (!adh || !adh.logged) missing.push("adherence — no days logged this week");
  return { weighIns, waists, lifts, adh, missing };
}

/* the adult's recomp protocol, Instructions §9, in the doc's own order. */
function recompCall(pid, endDate) {
  const inp = checkInInputs(pid, endDate);
  if (inp.missing.length) return { ready: false, missing: inp.missing, adh: inp.adh };

  const wRate = slopePerWeek(inp.weighIns);
  const waistDelta = inp.waists[inp.waists.length - 1].v - inp.waists[inp.waists.length - 2].v;
  const w = dir(wRate, FLAT_LB_WK), wa = dir(waistDelta, FLAT_WAIST_IN), li = inp.lifts.dir;

  const base = { ready: true, wRate, waistDelta, w, wa, li, adh: inp.adh, lifts: inp.lifts };
  if (wRate <= -1.8) return Object.assign(base, {
    call: "Add 150 kcal as carbs.",
    reason: "Losing " + R1(Math.abs(wRate)) + " lb a week is faster than this plan intends. Above 1.8 lb a week lean mass is at risk, and that is the thing the whole plan exists to keep."
  });
  if (w === "down" && wa === "down") return Object.assign(base, {
    call: "Hold everything.", reason: "Weight and waist are both moving down. That is the plan working."
  });
  if (w === "flat" && wa === "down") return Object.assign(base, {
    call: "Hold everything.", reason: "Weight is flat and the waist is down. That is recomposition happening, and it is the goal. A flat week is not a failure."
  });
  if (w === "down" && wa === "flat") return Object.assign(base, {
    call: "Hold, and look again next week.", reason: "Weight moved and the waist did not, which is usually water and glycogen rather than fat."
  });
  if (w === "up" && wa === "flat" && li === "up") return Object.assign(base, {
    call: "Hold everything.", reason: "Weight is up, the waist is not, and the lifts are moving. That combination is lean mass."
  });

/* ---- program creation (LL-403) -----------------------------

const MINOR_SPLIT = [
  { name: "Lower — squat pattern", opensExplosive: true },

  { name: "Lower — hinge pattern, trap bar", opensExplosive: true },

  }));

/* ---- minor session ordering (LL-402) -----------------------
   Panel §3 RESOLVED: "Son's sessions open with one explosive item (2–3 min,
   low volume, before fatigue), then linear-progression barbell work. The
   app's training screen enforces the ordering."

   Enforced in code, not in copy: the explosive entry is moved to index 0 on
   every write, it is flagged locked, and removeExercise() refuses to take it
   out while there is other work in the session. Swapping it for a DIFFERENT
   explosive item is fine — that is a choice, not a reorder.

   Names come from docs/01_PROFILES.md ("med ball throw or band start",
   "broad jump or start") and its defensive-end development list.
   ------------------------------------------------------------ */
const EXPLOSIVE = ["Med ball throw", "Broad jump", "Band start", "Get-off starts"];
const DE_SUPPLEMENTAL = ["Get-off starts", "Hip mobility", "Edge-setting", "Hand fighting", "Short-area change of direction"];
const EXPLOSIVE_MIN = 2, EXPLOSIVE_MAX = 3;
function isExplosive(name) {
  const n = String(name || "").toLowerCase();
  return EXPLOSIVE.some(x => x.toLowerCase() === n);
}
/* For a minor: guarantee exactly one explosive entry and put it first. */
function reorderSession(pid, session) {
  const p = S.profiles[pid];
  if (!p || !p.isMinor) return session;
  let idx = session.entries.findIndex(e => isExplosive(e.exercise));
  if (idx < 0) {
    session.entries.unshift({ exercise: EXPLOSIVE[0], sets: [], minutes: null, explosive: true, locked: true });
    idx = 0;
  }
  const e = session.entries.splice(idx, 1)[0];
  e.explosive = true;
  e.locked = true;
  if (e.minutes === undefined) e.minutes = null;
  session.entries.unshift(e);
  /* only one opener — any further explosive items are ordinary work */
  session.entries.slice(1).forEach(x => { x.locked = false; x.explosive = false; });
  return session;
}
function explosiveOf(session) {
  return session && session.entries.length && session.entries[0].locked ? session.entries[0] : null;
}

/* ---- secondary metrics (LL-305) ----------------------------
   the adult only. Spec §4.5 lists adherence in this row too, but Panel §4
   RESOLVED puts adherence in the weekly check-in ONLY, and LL-303's
   acceptance says "here and nowhere else". The RESOLVED decision wins, so
   this row is protein hit rate and top-set progression.
   ------------------------------------------------------------ */
const HIT_RATE_DAYS = 28;
function proteinHitRate(pid, endDate) {
  const target = S.profiles[pid].targets.protein;
  if (!(target > 0)) return null;
  let logged = 0, hit = 0;
  for (let i = 0; i < HIT_RATE_DAYS; i++) {
    const d = shiftDate(endDate, -i);
    const t = dayTotals(pid, d);
    if (!t.count) continue;
    logged++;
    if (t.t.p >= target) hit++;
  }
  return { logged, hit, target, pct: logged ? hit / logged * 100 : null, days: HIT_RATE_DAYS };
}
function topSetProgression(pid, endDate) {
  const sets = topSets(pid, endDate, 365);
  return Object.keys(sets).filter(k => sets[k].length >= 2).map(k => {
    const a = sets[k], first = a[0], last = a[a.length - 1];
    return {
      exercise: k, first, last,
      deltaLb: last.lb - first.lb,
      deltaReps: last.lb === first.lb ? last.reps - first.reps : 0,
      sessions: a.length
    };
  }).sort((x, y) => y.deltaLb - x.deltaLb);
}

/* ---- growth protocol (LL-304) ------------------------------
   Instructions §9, the minor's check-in. Weighs once a week, so the call is
   built from weekly readings and there is no rolling average — the doc is
   explicit about that.

   THRESHOLD: 0.25 lb/week, which is the bottom of his own target band in
   01_PROFILES. Below that in either direction is not a signal at one
   weigh-in a week. Stated on screen, same as the adult's.
   ------------------------------------------------------------ */
const MINOR_FLAT_LB_WK = 0.25;
function growthCall(pid, endDate) {
  const m = metricsOf(pid);
  const weighIns = inWindow(m.weight.map(w => ({ date: w.date, v: w.lb })), endDate, CHECKIN_WINDOW + 7);
  const lifts = liftsDirection(pid, endDate);
  const missing = [];
  if (weighIns.length < 2) missing.push("weigh-ins — " + weighIns.length + " so far, two is what makes a direction");
  if (missing.length) return { ready: false, missing, lifts };

  const rate = slopePerWeek(weighIns);
  const base = { ready: true, rate, lifts, weighIns: weighIns.length };

  /* The doc's order. Losing weight is checked FIRST and is never treated as
     a diet problem. */
  if (rate <= -MINOR_FLAT_LB_WK) return Object.assign(base, {
    call: "Add 400 kcal, and look at practice volume.",
    reason: "He is losing weight. That is a fuelling shortfall against training load, not a diet to investigate. More food first, then check how much practice is actually taking out of him."
  });
  if (rate > 0.75) return Object.assign(base, {
    call: "Hold calories. Check the lifts are moving.",
    reason: "Gaining more than 0.75 lb a week. Some of this is normal growth at fifteen and not a problem — the thing worth watching is whether the bar is going up with it."
  });
  if (rate >= 0.25) return Object.assign(base, {
    call: "On target. Hold.",
    reason: "Gaining " + R1(rate) + " lb a week" + (rate <= 0.5 ? ", inside the 0.25 to 0.5 band this plan aims at." :
      ", above the 0.25 to 0.5 band but under the 0.75 the protocol acts on. Nothing to change.")
  });
  /* flat */
  const flatBefore = flatLastWeekMinor(pid, endDate);
  if (flatBefore && lifts.known && lifts.dir === "flat") return Object.assign(base, {
    call: "Add 250 kcal.",
    reason: "Two flat weeks with the lifts flat as well. Under-eating is the default cause at this age and this training load, so food is the first lever, not the last."
  });
  return Object.assign(base, {
    call: "Hold. One flat week is not a signal.",
    reason: "Weight is flat this week. The protocol acts on two flat weeks with the lifts flat too" +
      (lifts.known ? "." : ", and there are no logged sessions yet to say whether the lifts are moving.")
  });
}
function flatLastWeekMinor(pid, endDate) {
  const prevEnd = shiftDate(endDate, -7);
  const w = inWindow(metricsOf(pid).weight.map(x => ({ date: x.date, v: x.lb })), prevEnd, CHECKIN_WINDOW + 7);
  if (w.length < 2) return false;
  return Math.abs(slopePerWeek(w)) < MINOR_FLAT_LB_WK;
}

/* Was the week before this one also flat/flat/flat? */
function stalledLastWeek(pid, endDate) {
  const prevEnd = shiftDate(endDate, -7);
  const m = metricsOf(pid);
  const w = inWindow(m.weight.map(x => ({ date: x.date, v: x.lb })), prevEnd, CHECKIN_WINDOW);
  const wa = inWindow(m.waist.map(x => ({ date: x.date, v: x.in })), prevEnd, 60);
  if (w.length < 4 || wa.length < 2) return false;
  const rate = slopePerWeek(w);
  const wd = wa[wa.length - 1].v - wa[wa.length - 2].v;
  const li = liftsDirection(pid, prevEnd);
  return dir(rate, FLAT_LB_WK) === "flat" && dir(wd, FLAT_WAIST_IN) === "flat" && li.dir === "flat";
}

function metricsOf(pid) {

        ' days, and these portions are planned after that, so they went in the freezer.</p>';
    }
    if (again.length) {
      h += '<div class="safety" style="margin-top:' + (thaw.length ? '.6rem' : '.4rem') + '">' +
        '<b>Cook again, do not freeze:</b> ' + again.map(r => esc(r.name) + ' · ' + thawAmount(r)).join("; ") + '.<br>' +
        'These are flagged as not freezing well, and they are planned beyond what the fridge holds.</div>';
    }
    h += '</div>';
  }
  return h;
}

/* ---------- batch panel ---------- */
function viewBatchPanel(weekId) {
  const rows = weekBatches(weekId);
  let h = '<div class="card" style="margin-top:.75rem"><div class="eyebrow">Cook this week — combined across both profiles</div>';
  if (!rows.length) {
    h += '<p class="muted" style="margin:.5rem 0 0;font-size:.9375rem">No recipes are assigned this week yet. Assign one in the grid and the batch you need appears here.</p></div>';
    return h;
  }
  for (const b of rows) {
    if (!b.recipe) continue;
    const r = b.recipe, c = r.computed || computeRecipe(r).computed;
    const yieldG = c.cookedG ? c.cookedG * b.chosen : null;
    h += '<div class="batch">' +
      '<div class="row"><span class="grow"><b>' + esc(r.name) + '</b><br>' +
      '<span class="sub num">' + R1(b.servingsNeeded) + ' servings needed · ' +
      Object.entries(b.byProfile).map(([pid, n]) => esc(S.profiles[pid] ? S.profiles[pid].name : pid) + " " + R1(n)).join(" + ") +
      '</span></span></div>' +
      '<div class="row" style="margin-top:.4rem">' +
      '<label class="muted" for="bm_' + r.id + '" style="font-size:.8125rem">Cook at ×</label>' +
      '<input id="bm_' + r.id + '" class="multin num" type="number" inputmode="decimal" min="0" step="0.25" value="' + b.chosen + '" ' +
      'data-act="batchMult" data-id="' + r.id + '" aria-label="Multiplier for ' + esc(r.name) + '">' +
      '<span class="grow sub num right">needs ×' + R1(b.required * 100) / 100 + (yieldG ? ' · yields ' + num(yieldG) + ' g' : '') + '</span></div>';

    if (b.freezeWarn) {
      h += '<div class="safety" style="margin-top:.5rem"><b>' + esc(r.name) + ' does not freeze.</b> ' +
        'It is assigned across ' + b.spanDays + ' days but only holds ' + b.holdsDays + '. ' +
        'Cook it a second time mid-week, or move a day closer.</div>';
    }

    h += '<details style="margin-top:.4rem"><summary class="btn sm" style="display:block;min-height:48px;line-height:2">' +
      'Raw ingredients at ×' + b.chosen + '</summary>' +
      '<table class="mono-table" style="margin-top:.4rem"><tbody>' +
      batchIngredients(r, b.chosen).map(x =>
        '<tr><td>' + esc(x.name) + (x.note ? ' <span class="muted">· ' + esc(x.note) + '</span>' : '') + '</td><td>' + num(x.grams) + ' g</td></tr>').join("") +
      '</tbody></table></details></div>';
  }
  h += '<p class="muted" style="font-size:.8125rem;margin:.5rem 0 0">Servings needed is computed from this week&rsquo;s assignments across both profiles. ' +
    'The multiplier is yours to set; it starts at the next quarter batch above what is needed.</p></div>';
  return h;
}

}
function copyResultToast(r) {

    : r.copied + " item" + (r.copied === 1 ? "" : "s") + " copied to " + r.days + " day" + (r.days === 1 ? "" : "s");

/* ---------- auto-fill the week (LL-622) ----------
   Two states in one sheet: the options, and the preview of what those options
   produced. Nothing is written from the first state — "Fill the week" is only
   offered once there is a preview on screen to have read. */
function sheetGenerate(result) {
  const pid = planPid(), p = S.profiles[pid];
  const onlyEmpty = UI.genOnlyEmpty !== false;
  /* LL-644: how many days, starting when. The start defaults to tomorrow —
     today only before the first meal's time — per the adult's rule; the chips
     override it. */
  const now = new Date();
  if (UI.genStart == null) UI.genStart = genDefaultStart(p, now.getHours() * 60 + now.getMinutes());
  const nDays = UI.genDays || 7;
  let h = sheetHead("Plan the days ahead", p.name + " · built from your recipes and favourites");

  h += '<div class="eyebrow">How many days</div><div class="wrap" style="margin-top:.4rem">';
  for (let i = 1; i <= 7; i++)
    h += '<button class="chipbtn" data-act="genDays" data-v="' + i + '" aria-pressed="' + (nDays === i) + '">' + i + '</button>';
  h += '</div>';

  h += '<div class="eyebrow" style="margin-top:.6rem">Starting</div><div class="wrap" style="margin-top:.4rem">' +
    '<button class="chipbtn" data-act="genStart" data-v="tomorrow" aria-pressed="' + (UI.genStart !== "today") + '">Tomorrow</button>' +
    '<button class="chipbtn" data-act="genStart" data-v="today" aria-pressed="' + (UI.genStart === "today") + '">Today</button></div>' +
    '<p class="muted" style="font-size:.8125rem;margin:.35rem 0 0">Tomorrow is the default — today only offers itself before breakfast, and a day half-eaten is not a day to plan.</p>';

  h += '<div class="eyebrow" style="margin-top:.6rem">Which slots</div><div class="wrap" style="margin-top:.4rem">' +
    '<button class="chipbtn" data-act="genScope" data-v="empty" aria-pressed="' + onlyEmpty + '">Only empty slots</button>' +
    '<button class="chipbtn" data-act="genScope" data-v="all" aria-pressed="' + (!onlyEmpty) + '">Replace those days</button></div>' +
    '<p class="muted" style="font-size:.8125rem;margin:.35rem 0 0">Plans only. Nothing you have already logged is touched, and Undo is on the Plan screen afterwards.</p>';

  h += '<div style="height:.6rem"></div><button class="btn full tall" data-act="genRun">' +
    (result ? "Work it out again" : "Work out " + nDays + " day" + (nDays === 1 ? "" : "s")) + '</button>';

  if (result && !result.ok) {
    h += '<div class="safety" style="margin-top:.7rem">' + esc(result.why) + '</div>';
    openSheet(h, { gen: null }); return;
  }

  if (result) {
    const tg = p.targets;
    h += '<div class="rule"></div><div class="eyebrow">What that gives ' + esc(p.name) + '</div>';
    h += '<table class="mono-table" style="margin-top:.4rem"><thead><tr><th>Day</th><th>kcal</th><th>Protein</th></tr></thead><tbody>';
    for (const d of result.days) {
      h += '<tr><td>' + esc(fmtDate(d.date)) + '</td>' +
        '<td>' + (d.n ? R(d.t.kcal) + ' <span class="fd num">' + esc(deltaText(d.t.kcal, tg.kcal)) + '</span>' : '—') + '</td>' +
        '<td>' + (d.n ? R(d.t.p) + ' g <span class="fd num">' + esc(deltaText(d.t.p, tg.protein)) + '</span>' : '—') + '</td></tr>';
    }
    h += '</tbody></table>' +
      '<p class="muted" style="font-size:.8125rem;margin:.4rem 0 0">Targets: <span class="num">' + num(tg.kcal) + '</span> kcal, <span class="num">' + tg.protein + '</span> g protein.</p>';

    for (const w of (result.warnings || []))
      h += '<div class="safety" style="margin-top:.6rem">' + esc(w) + '</div>';
    if (result.thin) h += '<div class="safety" style="margin-top:.6rem"><b>There are only ' + result.poolSize +
      ' things to build from</b>, so the week repeats. Star a few more foods as favourites on the Food tab, or add a recipe, and run it again.</div>';
    if (result.skipped) h += '<p class="muted" style="font-size:.8125rem;margin:.4rem 0 0">' + result.skipped +
      ' slot' + (result.skipped === 1 ? " was" : "s were") + ' left alone because something was already planned there.</p>';

    h += '<div class="rule"></div><div class="eyebrow">Every meal it would put in</div><div style="margin-top:.4rem">';
    let day = "";
    for (const row of result.rows) {
      if (row.date !== day) { day = row.date; h += '<p class="eyebrow" style="margin:.5rem 0 .2rem">' + esc(fmtDate(day)) + '</p>'; }
      const r = resolveItem(row.item);
      h += '<div class="item"><span class="grow"><span class="nm">' + esc(row.slotName) + ' — ' + esc(row.name) +
        (row.topUp ? ' <span class="fd">(to reach the protein target)</span>' : '') + '</span><br>' +
        '<span class="sub num">' + (row.item.servings != null ? R1(row.item.servings) + ' serving' + (row.item.servings === 1 ? '' : 's') : R(row.item.grams) + ' g') +
        (r ? ' · ' + R(r.macros.kcal) + ' kcal · ' + R1(r.macros.p) + ' g P' : '') + '</span></span>' +
        (r ? '<span class="conf ' + r.confidence + '">' + r.confidence.toUpperCase() + '</span>' : '') + '</div>';
    }
    h += '</div>';

    h += '<div style="height:.7rem"></div><button class="btn primary full tall" data-act="genApply">Fill the week — ' +
      result.rows.length + ' meal' + (result.rows.length === 1 ? '' : 's') + '</button>';
  } else {
    h += '<p class="muted" style="font-size:.875rem;margin:.7rem 0 0">It builds from the recipe bank plus anything ' + esc(p.name) +
      ' has starred or logged before — never from something you have not eaten. Amounts are worked out from each day&rsquo;s calorie target and rounded to a quarter serving or 5 g.</p>';
  }
  openSheet(h, { gen: result || null });
}

/* ---------- Food ---------- */
function viewFood(p) {
  let h = '<div class="tabs" role="tablist">' +
    tabBtn("log", "Log") + tabBtn("foods", "Foods") + tabBtn("recipes", "Recipes") + '</div>';
  if (UI.foodTab === "log") h += viewLogTab(p);
  else if (UI.foodTab === "foods") h += viewFoodsTab();
  else h += viewRecipesTab();
  return h;
}
function tabBtn(id, label) {
  return '<button role="tab" aria-selected="' + (UI.foodTab === id) + '" data-act="foodTab" data-ft="' + id + '">' + label + '</button>';
}

function recentFoodIds(pid) {
  const counts = {};
  const days = Object.keys(S.logs[pid] || {}).sort().reverse().slice(0, 30);
  for (const d of days) for (const e of S.logs[pid][d]) {
    if (!e.refId) continue;
    const k = e.source + ":" + e.refId;
    counts[k] = (counts[k] || 0) + 1;
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8).map(x => x[0]);
}

function viewLogTab(p) {
  let h = '<div class="field"><label for="q">Search foods and recipes</label>' +
    '<input id="q" type="search" value="' + esc(UI.search) + '" data-act="search" placeholder="chicken, tortilla, fajitas…"></div>';

  const q = UI.search.trim().toLowerCase();
  if (!q) {
    const favs = (S.favorites[p.id] || []);
    if (favs.length) {
      h += '<div class="card"><div class="eyebrow">Favorites</div><div style="margin-top:.5rem">' +
        favs.map(id => S.foods[id] ? logItemRow("food", id, S.foods[id].name, S.foods[id].confidence) : "").join("") + '</div></div>';
    }
    const rec = recentFoodIds(p.id);
    if (rec.length) {
      h += '<div class="card"><div class="eyebrow">Recents</div><div style="margin-top:.5rem">' +
        rec.map(k => {
          const [src, id] = k.split(":");
          const o = src === "food" ? S.foods[id] : S.recipes[id];
          return o ? logItemRow(src, id, o.name, src === "food" ? o.confidence : (o.computed ? o.computed.confidence : "unknown")) : "";
        }).join("") + '</div></div>';
    }
    h += '<div class="card"><div class="eyebrow">Everything else</div><p class="muted" style="margin:.4rem 0 0;font-size:.9375rem">Search above, or open the Foods and Recipes tabs.</p></div>';
    return h;
  }

  const foodHits = Object.values(S.foods).filter(f => f.name.toLowerCase().includes(q)).slice(0, 25);
  const recHits = Object.values(S.recipes).filter(r => !r.retired && r.name.toLowerCase().includes(q)).slice(0, 15);
  if (!foodHits.length && !recHits.length) {
    h += '<div class="card"><p style="margin:0">Nothing matches that. Add it on the Foods tab, with its per-100 g numbers and where they came from.</p></div>';
    return h;
  }
  if (recHits.length) h += '<div class="card"><div class="eyebrow">Recipes</div><div style="margin-top:.5rem">' +
    recHits.map(r => logItemRow("recipe", r.id, r.name, r.computed ? r.computed.confidence : "unknown")).join("") + '</div></div>';
  if (foodHits.length) h += '<div class="card"><div class="eyebrow">Foods</div><div style="margin-top:.5rem">' +
    foodHits.map(f => logItemRow("food", f.id, f.name, f.confidence)).join("") + '</div></div>';
  return h;
}
function logItemRow(src, id, name, conf) {
  return '<button class="item" data-act="pick" data-src="' + src + '" data-id="' + id + '">' +
    '<span class="grow nm">' + esc(name) + '</span><span class="conf ' + conf + '">' + conf.toUpperCase() + '</span></button>';
}

function viewFoodsTab() {
  let h = '<button class="btn full" data-act="newFood">＋ Add a food</button><div style="height:.6rem"></div>';
  h += '<div class="field"><label for="q2">Filter</label><input id="q2" type="search" value="' + esc(UI.search) + '" data-act="search"></div>';

      (f.per100g.fiber == null ? "fiber —" : R1(f.per100g.fiber) + " fib") + '</span></span>' +

function viewRecipesTab() {
  let h = '<button class="btn full" data-act="newRecipe">＋ Add a recipe</button><div style="height:.6rem"></div>';

/* ---------- slot sheet: adjust grams, log, review ---------- */
function sheetSlot(slotId) {
  const p = profile(), d = UI.date, s = slotOf(p, slotId);
  const entries = logsFor(p.id, d).filter(e => e.slotId === slotId);
  let h = sheetHead(s.name, (slotTime(s, d) || "no set time") + " · " + fmtDate(d));

  if (entries.length) {
    h += '<div class="eyebrow">Logged</div><div style="margin-top:.5rem">';
    for (const e of entries) {
      h += '<div class="item"><span class="grow"><span class="nm">' + esc(e.name) + '</span><br><span class="sub num">' +
        (e.grams != null ? R(e.grams) + " g · " : "") + R(e.macros.kcal) + ' kcal</span></span>' +
        '<button class="btn sm danger" data-act="unlog" data-id="' + e.id + '">Remove</button></div>';
    }
    h += '</div><div class="rule"></div>';
  }

  const addBtn = '<div style="height:.6rem"></div>' +
    '<button class="btn full tall" data-act="slotPlanAdd">＋ Add a recipe or a food to this meal</button>' +
    '<p class="muted" style="font-size:.8125rem;margin:.35rem 0 0">Goes on this day&rsquo;s plan, so it shows here, in the week grid, and on the grocery list.</p>';

  const planned = plannedItems(p, d, slotId);
  if (!planned.length) {
    h += '<p style="margin:0">Nothing in this meal yet.</p>' + addBtn;
    openSheet(h, { slotId }); return;
  }
  h += '<div class="eyebrow">Planned — adjust before logging</div><div style="margin-top:.5rem" id="plannedRows">';
  planned.forEach((it, i) => {
    const r = resolveItem(it);
    if (!r) return;
    h += '<div class="field"><label for="pl' + i + '">' + esc(r.name) + '</label>' +
      '<div class="row"><input class="grow" id="pl' + i + '" type="number" inputmode="decimal" step="' + (it.servings != null ? "0.25" : "1") + '" ' +
      'value="' + (it.servings != null ? it.servings : R(it.grams || 0)) + '" data-plidx="' + i + '" data-act="plInput">' +

      'A parked car in August is above 90°F.</div>';

  h += '<div class="field" style="margin-top:.7rem"><label for="rcMethod">Method — one step per line</label>' +
    '<textarea id="rcMethod" rows="6" style="min-height:130px" data-act="rcField" data-k="methodText">' + esc((r.method || []).join("\n")) + '</textarea></div>';

  h += '<div style="height:.7rem"></div><button class="btn primary full tall" data-act="rcSave">Save recipe</button>';

}

/* alsoPlan (LL-619) writes the same item into that day's plan cell, tagged with
   the log entry's id. It is how Today and Plan stay one set of meals: anything
   entered on Today shows up in the week grid and on the grocery list. It is
   NEVER passed when the items came FROM the plan — those rows are already there
   and would be duplicated. */
function logItems(slotId, items, methodTag, alsoPlan) {
  const p = profile(), d = UI.date, arr = logsFor(p.id, d);
  let n = 0;
  for (const it of items) {
    const r = resolveItem(it);
    if (!r) continue;
    const conf = methodTag === "estimate" ? "estimated" : r.confidence;
    const entry = {
      id: uid("e"), ts: Date.now(), slotId, name: r.name + (methodTag === "estimate" ? " (estimated ±25%)" : ""),
      grams: r.grams, servings: r.servings, macros: r.macros, fiberKnown: r.fiberKnown,
      confidence: conf, method: methodTag, source: r.source, refId: r.refId
    };
    arr.push(entry);
    if (alsoPlan) cellAdd(p, d, slotId, planRowOf(it, entry.id));
    n++;
  }
  save();
  noteWrite(n);
  return n;
}
/* The log item and the plan row are the same three fields. This keeps the
   servings/grams split identical to cellDraftItem() so the two entry points
   cannot drift apart. */
function planRowOf(it, entryId) {
  return it.servings != null
    ? { source: it.source, refId: it.refId, servings: it.servings, grams: null, fromLog: entryId }
    : { source: it.source, refId: it.refId, grams: it.grams, fromLog: entryId };
}

  genRun() {
    /* LL-644: N days from the chosen start, split by week because the pool
       rules (holding windows, rotation) are computed per generateWeek call */
    const p = S.profiles[planPid()];
    const n = UI.genDays || 7;
    const start = UI.genStart === "today" ? isoDate() : shiftDate(isoDate(), 1);
    const dates = [];
    for (let i = 0; i < n; i++) dates.push(shiftDate(start, i));
    const byWeek = {};
    for (const d of dates) { const w = weekIdOf(d); (byWeek[w] || (byWeek[w] = [])).push(d); }
    let merged = null;
    for (const [wid, ds] of Object.entries(byWeek)) {
      const r = generateWeek(p, wid, { onlyEmpty: UI.genOnlyEmpty !== false, dates: ds });
      if (!r.ok) { merged = r; break; }
      if (!merged) merged = { ok: true, rows: [], days: [], warnings: [], skipped: 0, poolSize: r.poolSize, thin: r.thin, range: { start, n } };
      merged.rows = merged.rows.concat(r.rows);
      merged.days = merged.days.concat(r.days);
      merged.warnings = merged.warnings.concat(r.warnings || []);
      merged.skipped += r.skipped || 0;
      merged.thin = merged.thin || r.thin;
    }
    sheetGenerate(merged);
  },
