<!DOCTYPE html>
<html lang="en" data-accent="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181A">
<title>LEANLINE</title>
<style>
:root{
  /* DARK is the default and the tuned one (Panel §5 RESOLVED). Light is a
     setting below. Every colour in this file is a token — no rule carries a
     hex. tools/contrast.mjs measures both palettes. */
  --bg:#16181A; --surface:#1F2225; --surface-2:#262A2E; --line:#2E3236;
  --text:#E8E6E3; --muted:#9A9691; --amber:#E8A33D; --turf:#4FA86B;
  --warn:#DB7267;          /* lifted from the spec's #D4574A: that value is 4.00:1 on --surface and fails AA */
  --dim:#77736F;           /* non-text marks and ≥18px numerals only (CLAUDE.md); lifted from #6E6A66, which was 2.98:1 on --surface */
  --control:#717476;       /* control BOUNDARIES (inputs, buttons) — 3:1, WCAG 1.4.11 */
  --on-accent:#16181A;      /* text sitting ON the accent fill */
  --press:#2A2318;          /* pressed state */
  --alert-bg:#231B1A;       /* banner + safety block ground */
  --today-bg:#1D2126;       /* today's column on the plan grid */
  --line-verified:#2F4A38; --line-estimated:#4A3A1E; --line-unknown:#4A2925;
  --accent:var(--amber);
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --scale:1;
}
[data-accent="turf"]{--accent:var(--turf);}
/* LIGHT — same token names, different values. Nothing else in the file changes. */
[data-theme="light"]{
  --bg:#F7F5F2; --surface:#FFFFFF; --surface-2:#ECE8E2; --line:#D3CDC5;
  --text:#191B1D; --muted:#57534E; --amber:#8A5300; --turf:#1F6B3F;
  --warn:#9E2A1B; --dim:#7A756F; --control:#89847E;
  --on-accent:#FFFFFF;
  --press:#F0E6D6;
  --alert-bg:#FBEEEB;
  --today-bg:#F0EDE7;
  --line-verified:#9CC3AC; --line-estimated:#D6BE8A; --line-unknown:#D9A79E;
}
*{box-sizing:border-box;}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);
  font-size:1rem;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
h1,h2,h3{margin:0;font-weight:600;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select,textarea{
  font:inherit;color:var(--text);background:var(--surface-2);
  border:1px solid var(--control);border-radius:8px;padding:.6rem .7rem;min-height:48px;width:100%;
}
input[type=checkbox]{width:28px;height:28px;min-height:28px;accent-color:var(--accent);}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ---------- chrome ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(.5rem + env(safe-area-inset-top)) .75rem .5rem;
  display:flex;align-items:center;gap:.5rem;
}
header::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent);}
.chip{
  display:flex;align-items:center;gap:.5rem;min-height:56px;padding:.4rem .8rem;
  border:1px solid var(--line);border-radius:999px;background:var(--surface);
  font-weight:700;letter-spacing:.06em;font-size:.875rem;
}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
.hdate{margin-left:auto;color:var(--muted);font-size:.875rem;}
main{padding:.75rem .75rem 1.5rem;max-width:720px;margin:0 auto;}
.screen-today{font-size:1.125rem;}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;min-height:56px;padding:.4rem 0 .5rem;color:var(--muted);
  font-size:.75rem;letter-spacing:.04em;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
}
nav button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent);}
nav .ni{font-size:1.05rem;line-height:1;}

/* ---------- blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.85rem;margin-bottom:.75rem;}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.rule{height:1px;background:var(--line);margin:.75rem 0;}
.row{display:flex;align-items:center;gap:.6rem;}
.grow{flex:1;min-width:0;}
.muted{color:var(--muted);}
.warn{color:var(--warn);}
.right{text-align:right;}
.stack>*+*{margin-top:.6rem;}
.wrap{display:flex;flex-wrap:wrap;gap:.5rem;}

.banner{
  border:1px solid var(--warn);border-left:4px solid var(--warn);border-radius:10px;
  background:var(--alert-bg);padding:.7rem .8rem;margin-bottom:.75rem;font-size:.9375rem;
}
.banner b{color:var(--warn);}

.headline{text-align:center;padding:.6rem 0 .2rem;}
.headline .kcal{font-size:3.25rem;line-height:1;letter-spacing:-.02em;}
.headline .of{color:var(--muted);font-size:1rem;margin-top:.35rem;}

/* ---------- gauges ---------- */
.gauges{margin:1rem 0 .35rem;}
.gauge{display:grid;grid-template-columns:5.2rem 1fr 6.2rem;align-items:center;gap:.55rem;margin-bottom:.55rem;}
.gauge .glabel{font-size:.75rem;letter-spacing:.1em;color:var(--muted);}
.gauge .gval{font-family:var(--font-num);font-size:.9375rem;text-align:right;white-space:nowrap;}
.gtrack{position:relative;height:12px;background:var(--surface-2);border:1px solid var(--control);border-radius:3px;overflow:hidden;}
.gauge.primary .gtrack{height:26px;}
.gauge.primary .glabel{color:var(--text);font-weight:700;}
.gauge.primary .gval{font-size:1.125rem;}
.gfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);}
.anim .gfill,.anim .gover{transition:width .2s ease-out;}
.gover{position:absolute;top:0;bottom:0;width:0;background:var(--warn);}
.gtick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.85;}
.gauge.over .gval{color:var(--warn);}

.oneline{font-size:1.125rem;margin:.5rem 0 .25rem;}

/* ---------- slots ---------- */
.slot{
  display:flex;align-items:center;gap:.5rem;width:100%;
  border:1px solid var(--control);border-radius:12px;background:var(--surface);
  padding:.55rem .6rem;margin-bottom:.5rem;min-height:56px;text-align:left;
}
.slot.now{border-color:var(--accent);}
.slot.done{background:var(--surface-2);}
.slot .st{font-family:var(--font-num);font-size:.9375rem;color:var(--muted);width:4.2rem;flex:0 0 auto;}
.slot .sn{font-size:1rem;}
.slot .sk{font-family:var(--font-num);font-size:1rem;}
.slot .tick{width:1.4rem;flex:0 0 auto;color:var(--accent);font-size:1.1rem;}
.logbtn{
  min-width:56px;min-height:56px;border:1px solid var(--accent);border-radius:10px;
  color:var(--accent);font-size:.8125rem;font-weight:700;letter-spacing:.04em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:0 0 auto;
}
.logbtn:active{background:var(--press);}
.slotwrap{display:flex;gap:.5rem;align-items:stretch;}
.slotwrap .slot{margin-bottom:0;}
.slotrow{margin-bottom:.5rem;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  min-height:48px;padding:.6rem 1rem;border-radius:10px;border:1px solid var(--control);
  background:var(--surface-2);font-weight:600;font-size:.9375rem;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn.full{width:100%;}
.btn.tall{min-height:56px;}
.btn.danger{border-color:var(--warn);color:var(--warn);}
.btn.sm{min-height:48px;padding:.4rem .7rem;font-size:.875rem;}
.btn[disabled]{opacity:.45;cursor:default;}

.tabs{display:flex;gap:.4rem;margin-bottom:.75rem;}
.tabs button{
  flex:1;min-height:48px;border:1px solid var(--control);border-radius:10px;
  background:var(--surface);color:var(--muted);font-weight:600;font-size:.9375rem;
}
.tabs button[aria-selected="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent);}

.item{
  display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;
  border:1px solid var(--control);border-radius:10px;background:var(--surface);
  padding:.5rem .6rem;min-height:48px;margin-bottom:.4rem;
}
.item .nm{font-size:.9375rem;}
.item .sub{font-size:.8125rem;color:var(--muted);}
.conf{
  font-family:var(--font-num);font-size:.6875rem;letter-spacing:.06em;padding:.15rem .35rem;
  border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap;
}
.conf.verified{color:var(--turf);border-color:var(--line-verified);}
.conf.estimated{color:var(--amber);border-color:var(--line-estimated);}
.conf.unknown{color:var(--warn);border-color:var(--line-unknown);}
.dense{border-left:3px solid var(--amber);padding-left:.6rem;font-size:.875rem;color:var(--muted);}
.safety{border:1px solid var(--warn);border-radius:10px;padding:.6rem .7rem;font-size:.875rem;background:var(--alert-bg);}
.mono-table{width:100%;border-collapse:collapse;font-family:var(--font-num);font-size:.875rem;}
.mono-table td,.mono-table th{padding:.3rem 0;text-align:right;border-bottom:1px solid var(--line);}
.mono-table th:first-child,.mono-table td:first-child{text-align:left;font-family:var(--font-ui);}
.mono-table th{color:var(--muted);font-weight:500;font-size:.75rem;letter-spacing:.06em;}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  max-height:88vh;overflow:auto;padding:.9rem .85rem calc(1.2rem + env(safe-area-inset-bottom));
  max-width:720px;margin:0 auto;
}
.sheet h2{font-size:1.125rem;margin-bottom:.25rem;}
.sheet .close{position:absolute;right:.6rem;top:.6rem;min-width:48px;min-height:48px;color:var(--muted);}
.sheethead{position:relative;padding-right:3.5rem;margin-bottom:.6rem;}
.field label{display:block;font-size:.8125rem;color:var(--muted);margin-bottom:.25rem;}
.field+.field{margin-top:.6rem;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;}
.chipbtn{min-height:48px;min-width:48px;padding:.4rem .7rem;border:1px solid var(--control);border-radius:999px;background:var(--surface-2);font-size:.875rem;}
/* A label wrapping a checkbox or radio IS the touch target: the control
   inside is 28px, the label is what the finger lands on. */
.tap{min-height:48px;min-width:48px;display:flex;align-items:center;}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);}
.ing{display:grid;grid-template-columns:1fr 5.5rem 48px;gap:.4rem;align-items:center;margin-bottom:.4rem;}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:.55rem 1rem;font-size:.9375rem;z-index:50;
}
/* ---------- plan (dense screen) ---------- */
.weeknav{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;}
.weeknav .wklabel{flex:1;text-align:center;font-family:var(--font-num);font-size:.9375rem;}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface);}
.wkgrid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:.8125rem;}
.wkgrid th,.wkgrid td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;}
.wkgrid thead th{
  position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--muted);
  font-weight:600;font-size:.75rem;letter-spacing:.04em;padding:.45rem .4rem;text-align:center;white-space:nowrap;
}
.wkgrid th.slotname{
  position:sticky;left:0;z-index:3;background:var(--surface-2);text-align:left;
  padding:.45rem .5rem;min-width:6.5rem;font-weight:600;color:var(--text);white-space:nowrap;
}
.wkgrid thead th.slotname{z-index:4;}
.wkgrid th.today,.wkgrid td.today{background:var(--today-bg);}
.wkgrid thead th.today{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);}
.cell{
  display:block;width:100%;min-width:5.6rem;min-height:48px;padding:.4rem .35rem;
  text-align:center;background:none;border:none;
}
.cell .ck{font-family:var(--font-num);font-size:.875rem;display:block;}
.cell .cp{font-family:var(--font-num);font-size:.75rem;color:var(--muted);display:block;}
.cell .assign{color:var(--muted);font-size:.8125rem;}  /* --muted, never --dim: --dim fails AA at this size */
.cell.set{box-shadow:inset 3px 0 0 var(--accent);}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;}
.wkgrid tfoot th.slotname,.wkgrid tfoot td{background:var(--surface-2);border-top:2px solid var(--line);}
.wkgrid tfoot th.slotname{font-weight:600;}
.ftarget{font-size:.6875rem;color:var(--muted);font-weight:400;}
.ftot{padding:.35rem .4rem;text-align:center;}
.fv{display:block;font-size:.875rem;white-space:nowrap;}
.fv.isover{color:var(--warn);}
.fd{display:block;font-size:.6875rem;color:var(--muted);white-space:nowrap;}
.batch{border-top:1px solid var(--line);padding-top:.6rem;margin-top:.6rem;}
.batch:first-of-type{border-top:none;padding-top:.2rem;margin-top:.4rem;}
.multin{width:5.5rem;flex:0 0 auto;text-align:center;}
.batch details summary{cursor:pointer;}
.batch details summary::-webkit-details-marker{display:none;}
/* ---------- onboarding ---------- */
body.onbmode nav{display:none;}
body.onbmode{padding-bottom:1rem;}
.onb{max-width:520px;margin:0 auto;}
.onbtop{margin-bottom:1rem;}
.onbsteps{display:flex;gap:.35rem;}
.onbdot{height:5px;flex:1;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);}
.onbdot.on{background:var(--accent);border-color:var(--accent);}
.onbdot.past{background:var(--control);border-color:var(--control);}
.onbopt{
  display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;min-height:56px;
  border:1px solid var(--control);border-radius:12px;background:var(--surface);
  padding:.7rem .8rem;margin-bottom:.5rem;font-size:1rem;
}
.onbopt.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);}
.onbopt .sub{font-size:.8125rem;color:var(--muted);}
.onbnav{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-top:1.2rem;}
.onbnav .btn{min-width:7rem;}
/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;margin-top:.5rem;overflow:visible;}
.chart .ax{stroke:var(--line);stroke-width:1;}
.chart .axl{fill:var(--muted);font-family:var(--font-num);font-size:9px;}
.chart .axl.ar{text-anchor:end;}
.chart .dot{fill:var(--dim);}
.chart .ln{stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
.chart .ln.wt{stroke:var(--accent);}
.chart .ln.wa{stroke:var(--text);stroke-width:1.5;}
.chart .ln.lift{stroke:var(--accent);}
.legend{font-size:.8125rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;}
.sw{width:18px;height:0;border-top:2px solid var(--accent);display:inline-block;flex:0 0 auto;}
.sw.wa{border-top:2px dashed var(--text);}
.owner{font-size:.6875rem;letter-spacing:.08em;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:.1rem .3rem;white-space:nowrap;}
.slotedit{border-top:1px solid var(--line);padding-top:.5rem;margin-top:.5rem;}
.slotedit:first-of-type{border-top:none;margin-top:.2rem;}
.wdrow{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin-top:.4rem;}
.wd{font-size:.6875rem;color:var(--muted);}
.wd span{display:block;margin-bottom:.1rem;}
.wd input{padding:.35rem .3rem;min-height:48px;font-size:.8125rem;}
.exblock{border-top:1px solid var(--line);padding-top:.6rem;margin-top:.6rem;}
.exblock:first-of-type{border-top:none;margin-top:.3rem;}
.prev{font-size:.8125rem;color:var(--muted);margin:.2rem 0 0;font-family:var(--font-num);}
.prev.muted{font-family:var(--font-ui);}
.perish{font-size:.8125rem;color:var(--muted);margin:.1rem 0 .3rem 2.2rem;}
.perish b{color:var(--warn);}
.planhint{font-size:.8125rem;color:var(--muted);margin:.4rem 0 0;}
@media (prefers-reduced-motion: reduce){.anim .gfill,.anim .gover{transition:none;}}
</style>

<body>
<header>
  <button class="chip" data-act="profiles" aria-label="Active profile. Tap to switch profile or open settings.">
    <span class="dot" aria-hidden="true"></span><span id="chipName">—</span>
  </button>
  <span class="hdate num" id="hdate"></span>
</header>

<main id="app"></main>

<nav aria-label="Main">
  <button data-act="tab" data-tab="today"><span class="ni" aria-hidden="true">◉</span>Today</button>
  <button data-act="tab" data-tab="plan"><span class="ni" aria-hidden="true">▦</span>Plan</button>
  <button data-act="tab" data-tab="food"><span class="ni" aria-hidden="true">◍</span>Food</button>
  <button data-act="tab" data-tab="train"><span class="ni" aria-hidden="true">▲</span>Train</button>
  <button data-act="tab" data-tab="progress"><span class="ni" aria-hidden="true">◑</span>Progress</button>
</nav>

<div id="sheetRoot"></div>

<script>
"use strict";

/* ============================================================
   0. UTIL
   ============================================================ */
const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const R = n => Math.round(n);
const R1 = n => Math.round(n * 10) / 10;
const uid = p => p + "_" + Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isoDate = d => {
  const x = d || new Date();
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
};
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtDate = s => { const d = parseISO(s); return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()]; };
const CONF_RANK = { verified: 3, estimated: 2, unknown: 1 };
const weakest = list => list.reduce((a, b) => (CONF_RANK[b] < CONF_RANK[a] ? b : a), "verified");
const num = n => (n == null ? "—" : R(n).toLocaleString());

/* ============================================================
   1. STORAGE ADAPTER  —  window.storage → localStorage → memory
   Silent fallback. Never mentioned to the user except in Settings.
   ============================================================ */
const KEY = "leanline:v1";
const BAK = "leanline:v1:bak";
let Store = null;

async function makeStore() {
  if (window.storage && typeof window.storage.get === "function") {
    try {
      await window.storage.set("leanline:probe", "1");
      return {
        kind: "window.storage",
        async get(k) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch (e) { return null; } },
        async set(k, v) { await window.storage.set(k, v); }
      };
    } catch (e) { /* fall through */ }
  }
  try {
    localStorage.setItem("leanline:probe", "1");
    localStorage.removeItem("leanline:probe");
    return {
      kind: "localStorage",
      async get(k) { return localStorage.getItem(k); },
      async set(k, v) { localStorage.setItem(k, v); }
    };
  } catch (e) { /* fall through */ }
  const mem = {};
  return { kind: "in-memory (this session only)", async get(k) { return mem[k] ?? null; }, async set(k, v) { mem[k] = v; } };
}

let saveTimer = null, saving = false, dirty = false;
function save() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}
async function flush() {
  if (!Store || saving || !dirty) return;
  saving = true; dirty = false;
  try {
    const payload = JSON.stringify(S);
    const prev = await Store.get(KEY);
    if (prev) await Store.set(BAK, prev);   // previous good copy survives a crash mid-write

function backfillLibrary(st) {
  if (!st.foods) st.foods = {};

/* the adult's program, from docs/01_PROFILES.md "Training".
   The P90X block days ARE stated there and are seeded. The 5-day lifting
   split's day assignments are NOT — the doc marks them "day assignments
   unconfirmed" — so they are seeded with dayOfWeek null and unconfirmed:true.
   The app shows them as unconfirmed rather than inventing a split (LL-404,
   blocked on LL-903). */
/* Everything in the seed that is about a PERSON lives here, behind one seam.
   The app itself always uses this. A distribution that must not carry anyone's
   health data replaces THIS FUNCTION and nothing else — see pwa/build.mjs. */
function seedPeople() {
  /* Installable distribution: NOBODY is seeded. No name, no age, no weight, no
     target, no log. The app opens straight into setup, which is the only way a
     person gets in — and everything they enter stays on their own device. */
  return {
    activeProfileId: null,
    profiles: {},
    logs: {},
    metrics: {},
    training: {},
    favorites: {}
  };
}

/* The food and recipe library plus empty containers. Nothing here is about a
   person, so it is identical in every distribution. */
function seedState() {
  const people = seedPeople();
  return Object.assign({
    schemaVersion: 1,
    settings: { theme: "dark", textScale: 1, units: "imperial", weekStartsOn: 1 },
    foods: seedFoods(),
    recipes: seedRecipes(),
    plans: {},
    pantry: {},
    grocery: {}
  }, people);
}

/* ============================================================
   4. MACRO MATH  — computed on write, never on render
   ============================================================ */
const ZERO = () => ({ kcal: 0, p: 0, c: 0, f: 0, fiber: 0 });

function computeRecipe(r, st) {
  st = st || S;
  const b = ZERO();
  let fiberKnown = true;
  const confs = [];
  for (const ing of r.ingredients) {
    const food = st.foods[ing.foodId];
    if (!food) { confs.push("unknown"); fiberKnown = false; continue; }
    const k = ing.rawGrams / 100;
    b.kcal += food.per100g.kcal * k;
    b.p += food.per100g.p * k;
    b.c += food.per100g.c * k;
    b.f += food.per100g.f * k;
    if (food.per100g.fiber == null) fiberKnown = false; else b.fiber += food.per100g.fiber * k;
    confs.push(food.confidence);
  }
  const cooked = r.actualCookedG || r.expectedCookedG || null;
  const per100g = cooked ? scale(b, 100 / cooked) : null;
  const perServing = r.servings ? scale(b, 1 / r.servings) : null;
  r.computed = {
    batch: b, per100g, perServing,
    cookedG: cooked,
    calibrated: !!r.actualCookedG,
    fiberComplete: fiberKnown,
    confidence: confs.length ? weakest(confs) : "unknown"
  };
  return r;
}
function scale(m, k) { return { kcal: m.kcal * k, p: m.p * k, c: m.c * k, f: m.f * k, fiber: m.fiber * k }; }
function addTo(a, b) { a.kcal += b.kcal; a.p += b.p; a.c += b.c; a.f += b.f; a.fiber += b.fiber; return a; }

/* Resolve a planned item or a log request into name + macros + confidence. */
function resolveItem(it) {
  if (it.source === "food") {
    const f = S.foods[it.refId];
    if (!f) return null;
    const g = it.grams || 0, k = g / 100;
    return {
      name: f.name, grams: g, servings: null,
      macros: { kcal: f.per100g.kcal * k, p: f.per100g.p * k, c: f.per100g.c * k, f: f.per100g.f * k, fiber: (f.per100g.fiber || 0) * k },
      fiberKnown: f.per100g.fiber != null,
      confidence: f.confidence, source: "food", refId: it.refId
    };
  }
  const r = S.recipes[it.refId];
  if (!r) return null;
  if (!r.computed) computeRecipe(r);
  if (it.servings != null) {
    const m = scale(r.computed.perServing || ZERO(), it.servings);
    return {
      name: r.name + " · " + R1(it.servings) + " serving" + (it.servings === 1 ? "" : "s"),
      grams: null, servings: it.servings, macros: m, fiberKnown: r.computed.fiberComplete,
      confidence: r.computed.confidence, source: "recipe", refId: it.refId
    };
  }
  const per = r.computed.per100g;
  if (!per) return null;
  const g = it.grams || 0;
  return {
    name: r.name, grams: g, servings: null, macros: scale(per, g / 100),
    fiberKnown: r.computed.fiberComplete, confidence: r.computed.confidence,
    source: "recipe", refId: it.refId
  };
}

function profile(id) { return S.profiles[id || S.activeProfileId]; }
function slotOf(p, id) { return p.slots.find(s => s.id === id); }
function slotTime(slot, dateStr) {
  const wd = parseISO(dateStr).getDay();
  const t = slot.timeByWeekday[wd];
  return t !== undefined ? t : slot.timeByWeekday.def;
}
function templateFor(p, dateStr) {
  const wd = parseISO(dateStr).getDay();
  const key = (p.dayTemplates.byWeekday || [])[wd] || "A";
  return p.dayTemplates[key] || {};
}
/* ---- weeks -------------------------------------------------
   weekId IS the ISO date of the week's first day, so it sorts,
   reads, and survives a settings change without a lookup table.
   ------------------------------------------------------------ */
function weekStartOf(dateStr, weekStartsOn) {
  const ws = weekStartsOn == null ? 1 : weekStartsOn;
  const d = parseISO(dateStr);
  d.setDate(d.getDate() - ((d.getDay() - ws + 7) % 7));
  return isoDate(d);
}
function weekIdOf(dateStr) { return weekStartOf(dateStr, S.settings.weekStartsOn); }
function weekDates(weekId) {
  const out = [], d = parseISO(weekId);
  for (let i = 0; i < 7; i++) { out.push(isoDate(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function shiftDate(dateStr, days) { const d = parseISO(dateStr); d.setDate(d.getDate() + days); return isoDate(d); }
function weekLabel(weekId) {
  const a = parseISO(weekId), b = parseISO(weekDates(weekId)[6]);
  return DAYS[a.getDay()] + " " + a.getDate() + " " + MONTHS[a.getMonth()] +
    " – " + DAYS[b.getDay()] + " " + b.getDate() + " " + MONTHS[b.getMonth()];
}

/* ---- plans, spec §3 shape: plans[weekId].days[date][profileId] = [ {slotId,…} ]
   A slot with a single { source:"empty" } row is EXPLICITLY empty and does not
   fall back to the template. Removing every row for a slot restores the template.
   ------------------------------------------------------------ */
function planWeek(weekId, create) {
  let w = S.plans[weekId];
  if (!w && create) w = S.plans[weekId] = { weekId, batches: [], days: {} };
  return w || null;
}
function planDay(weekId, dateStr, pid, create) {
  const w = planWeek(weekId, create);
  if (!w) return null;
  if (!w.days[dateStr]) { if (!create) return null; w.days[dateStr] = {}; }
  if (!w.days[dateStr][pid]) { if (!create) return null; w.days[dateStr][pid] = []; }
  return w.days[dateStr][pid];
}
/* [] = explicitly empty, null = nothing explicit (use the template) */
function explicitSlot(p, dateStr, slotId) {
  const arr = planDay(weekIdOf(dateStr), dateStr, p.id, false);
  if (!arr) return null;
  const hits = arr.filter(x => x.slotId === slotId);
  if (!hits.length) return null;
  return hits.filter(x => x.source !== "empty");
}
function plannedItems(p, dateStr, slotId) {
  const ex = explicitSlot(p, dateStr, slotId);
  if (ex) return ex;                                  // [] is truthy — explicitly empty stays empty
  return (templateFor(p, dateStr)[slotId] || []);
}
function slotIsExplicit(p, dateStr, slotId) { return explicitSlot(p, dateStr, slotId) !== null; }

/* Editing a cell that is still showing a template must not edit the template.
   Copy the template's items into the week first, then edit the copy. */
function materializeCell(p, dateStr, slotId) {
  const arr = planDay(weekIdOf(dateStr), dateStr, p.id, true);
  if (!slotIsExplicit(p, dateStr, slotId)) {
    for (const it of (templateFor(p, dateStr)[slotId] || []))
      arr.push(Object.assign({ slotId }, JSON.parse(JSON.stringify(it))));
    if (!arr.some(x => x.slotId === slotId)) arr.push({ slotId, source: "empty", refId: null, grams: null });
  }
  return arr;
}
function dropSlotRows(arr, slotId) {
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i].slotId === slotId) arr.splice(i, 1);
}
/* Remove the empty scaffolding a cell leaves behind so state does not bloat.
   Only containers are pruned — never a planned item, a log, or a recipe. */
function pruneCell(weekId, dateStr, pid) {
  const w = S.plans[weekId]; if (!w) return;
  const day = w.days[dateStr]; if (!day) return;
  if (day[pid] && !day[pid].length) delete day[pid];
  if (!Object.keys(day).length) delete w.days[dateStr];
  if (!Object.keys(w.days).length && !(w.batches || []).length) delete S.plans[weekId];
}
function cellAdd(p, dateStr, slotId, item) {
  const arr = materializeCell(p, dateStr, slotId);
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i].slotId === slotId && arr[i].source === "empty") arr.splice(i, 1);
  arr.push(Object.assign({ slotId }, item));
  save();
  noteWrite();
}
function cellRemoveAt(p, dateStr, slotId, idx) {
  const arr = materializeCell(p, dateStr, slotId);
  const rows = arr.filter(x => x.slotId === slotId && x.source !== "empty");
  const target = rows[idx];
  if (target) arr.splice(arr.indexOf(target), 1);
  if (!arr.some(x => x.slotId === slotId)) arr.push({ slotId, source: "empty", refId: null, grams: null });
  save();
}
/* LL-619: a plan row the app added only because the meal was logged carries
   the log entry's id. Removing the log removes the row, so a mis-logged meal
   cannot linger on the week's plan or on the grocery list. The row is dropped
   outright rather than replaced with the "empty" marker: undoing a log should
   leave the cell exactly as it was, template fallback included. */
function removePlannedFromLog(p, dateStr, slotId, entryId) {
  const wid = weekIdOf(dateStr);
  const arr = planDay(wid, dateStr, p.id, false);
  if (!arr) return false;
  const i = arr.findIndex(x => x.slotId === slotId && x.fromLog === entryId);
  if (i < 0) return false;
  arr.splice(i, 1);
  pruneCell(wid, dateStr, p.id);
  save();
  return true;
}
function cellResetToTemplate(p, dateStr, slotId) {
  const wid = weekIdOf(dateStr);
  const arr = planDay(wid, dateStr, p.id, false);
  if (!arr) return;
  dropSlotRows(arr, slotId);
  pruneCell(wid, dateStr, p.id);
  save();
}
function cellClearToEmpty(p, dateStr, slotId) {
  const arr = materializeCell(p, dateStr, slotId);
  dropSlotRows(arr, slotId);
  arr.push({ slotId, source: "empty", refId: null, grams: null });
  save();
}

/* ---- fill a week automatically (LL-622) ---------------------
   the adult asked for a week's plan to be generated. The hard part is not the
   filling, it is doing it without breaking the first rule of this project:
   NOTHING HERE INVENTS A NUMBER. Every row the generator produces points at a
   recipe or a food that already exists, with its own sourced macros, and the
   only figure the generator itself produces is HOW MUCH — which is a division,
   shown on screen, and rounded to something a person can actually serve.

   IT ALSO INVENTS NOTHING ABOUT TASTE. The pool is what this profile already
   eats: the recipe bank, plus their starred favourites, plus what they have
   actually logged. A brand-new profile with no history gets the recipes and is
   TOLD to star some favourites for more variety, rather than being served a
   week of whatever a stranger imagines a snack is.

   NOTHING IS WRITTEN UNTIL IT HAS BEEN SEEN. generateWeek() returns a plan and
   a per-day preview against target; applyGeneratedWeek() is a separate call,
   snapshots for undo, and touches plans only — never a logged entry.
   ------------------------------------------------------------ */
function sortedSlots(p, dateStr) {
  return p.slots.slice().sort((a, b) => {
    const ta = slotTime(a, dateStr), tb = slotTime(b, dateStr);
    if (!ta && !tb) return 0; if (!ta) return 1; if (!tb) return -1;
    return ta < tb ? -1 : 1;

/* What this person actually eats. Recipes first — they are the meals — then the
   foods they have starred or logged. Order is stable so a preview reproduces. */
function genPool(p) {
  const recipes = Object.values(S.recipes)
    .filter(r => !r.retired && (r.computed || computeRecipe(r).computed))
    .filter(r => (r.computed.perServing && r.computed.perServing.kcal > 0) ||
                 (r.computed.per100g && r.computed.per100g.kcal > 0))
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(r => ({ kind: "recipe", id: r.id, name: r.name }));
  const ids = [];
  for (const id of (S.favorites[p.id] || [])) if (S.foods[id] && ids.indexOf(id) < 0) ids.push(id);
  for (const k of recentFoodIds(p.id)) {
    const i = k.indexOf(":"), src = k.slice(0, i), id = k.slice(i + 1);
    if (src === "food" && S.foods[id] && ids.indexOf(id) < 0) ids.push(id);

     rice, the tortillas, the milk. Same principle as favourites: it is food
     they have already decided they eat, not food this code picked for them.
     Without it the pool is protein-heavy recipes and nothing to balance them
     against, and no amount of clever selection can fix a pool with no carbs. */
  for (const key of ["A", "B"]) {
    const tpl = (p.dayTemplates || {})[key] || {};
    for (const slotId of Object.keys(tpl))
      for (const it of (tpl[slotId] || []))
        if (it.source === "food" && S.foods[it.refId] && ids.indexOf(it.refId) < 0) ids.push(it.refId);
  }
  const foods = ids.filter(id => S.foods[id].per100g.kcal > 0)
    .map(id => ({ kind: "food", id, name: S.foods[id].name }));
  return { recipes, foods };
}
/* kcal each slot is aiming at. A slot with its own targetKcal keeps it; what is
   left of the day's target is split evenly across the rest. */
function slotBudgets(p, dateStr) {
  const slots = sortedSlots(p, dateStr);
  const named = slots.reduce((a, s) => a + (s.targetKcal > 0 ? s.targetKcal : 0), 0);
  const open = slots.filter(s => !(s.targetKcal > 0)).length;
  const rest = Math.max(0, (p.targets.kcal || 0) - named);
  const each = open ? rest / open : 0;
  return slots.map(s => ({ slot: s, kcal: s.targetKcal > 0 ? s.targetKcal : each }));
}
/* HOW MUCH OF ONE THING IS A PORTION. Solving on calories alone is arithmetically
   correct and practically useless: the first working version planned 100 g of
   honey as a dinner and 395 g of cottage cheese as a pre-training meal. Both hit
   their calorie budget exactly. Neither is a thing a person eats.

   The cap comes from data the app already holds wherever possible — a food's own
   portionHints are a RECORDED serving (1 medium apple 182 g, 1 tortilla 62 g,
   1 stick 28 g), so three of those is a generous but real plate. Where there is
   no recorded portion the cap is a stated planning limit, not a claim about the
   food: 250 g of an ordinary food, 50 g of a dense one, 2 servings of a recipe.
   It is a constraint on the plan, and it is said out loud on the sheet.

   DENSE FOODS ARE NEVER A MEAL. `dense` already marks the oils, syrups, sour
   cream and hard cheeses — the things that go ON something. They are allowed
   alongside a main and never as the main, which is what stopped honey being
   dinner. */
const GEN_CAP_PLAIN_G = 250, GEN_CAP_DENSE_G = 50, GEN_CAP_SERVINGS = 2, GEN_CAP_HINTS = 3;
function genPortionCap(pick) {
  if (pick.kind === "recipe") return { servings: GEN_CAP_SERVINGS };
  const f = S.foods[pick.id];
  if (!f) return { grams: GEN_CAP_PLAIN_G };
  const hints = (f.portionHints || []).map(x => x.grams).filter(g => g > 0);
  if (hints.length) {
    const biggest = Math.max.apply(null, hints);
    return { grams: biggest * (f.dense ? 1 : GEN_CAP_HINTS), fromHint: true };
  }
  return { grams: f.dense ? GEN_CAP_DENSE_G : GEN_CAP_PLAIN_G };
}
function genIsDense(pick) { return pick.kind === "food" && !!(S.foods[pick.id] || {}).dense; }

/* The amount that lands on a kcal budget. This division IS the whole of what
   the generator computes, and it is rounded to a quarter serving or 5 g so the
   plan asks for something a person can serve. */
function genAmountFor(pick, kcalBudget) {
  if (!(kcalBudget > 0)) return null;
  const cap = genPortionCap(pick);
  if (pick.kind === "recipe") {
    const r = S.recipes[pick.id]; if (!r) return null;
    const c = r.computed || computeRecipe(r).computed;
    if (c.perServing && c.perServing.kcal > 0) {
      let n = Math.max(0.25, Math.round(kcalBudget / c.perServing.kcal * 4) / 4);
      if (cap.servings) n = Math.min(n, cap.servings);
      return { source: "recipe", refId: pick.id, grams: null, servings: n };
    }
    if (c.per100g && c.per100g.kcal > 0) {
      let g = Math.max(5, Math.round(kcalBudget / c.per100g.kcal * 100 / 5) * 5);
      const gcap = cap.servings ? cap.servings * (c.cookedG / (r.servings || 1)) : GEN_CAP_PLAIN_G;
      if (gcap > 0) g = Math.min(g, Math.max(5, Math.round(gcap / 5) * 5));
      return { source: "recipe", refId: pick.id, grams: g };
    }
    return null;
  }
  const f = S.foods[pick.id];
  if (!f || !(f.per100g.kcal > 0)) return null;
  let g = Math.max(5, Math.round(kcalBudget / f.per100g.kcal * 100 / 5) * 5);
  if (cap.grams > 0) g = Math.min(g, Math.max(5, Math.round(cap.grams / 5) * 5));
  return { source: "food", refId: pick.id, grams: g };
}
/* Panel §8: the freezes flag is real. A batch that cannot be frozen has to be
   eaten inside holdsDays, so the generator will not spread one wider than that.
   It picks the next candidate instead rather than quietly planning a meal that
   would have gone off. */
function genRecipeFitsDay(pick, dateStr, firstSeen) {
  if (pick.kind !== "recipe") return true;
  const r = S.recipes[pick.id];
  if (!r || r.freezes !== false || r.holdsDays == null) return true;
  const first = firstSeen[pick.id];
  if (!first) return true;
  return Math.round((parseISO(dateStr) - parseISO(first)) / 86400000) <= r.holdsDays;
}
/* What a short day gets topped up with: whatever in the pool best matches the
   macros the day is still missing. It used to be "the most protein per calorie",
   which is right only when protein is what is short — on a day already 100 g
   over on protein it made things worse. Never a new food, always one already in
   the pool, and never a dense one, which is not a thing to eat more of. */
function genTopUpPick(pool, want, usedToday, dateStr, firstSeen) {
  let best = null, bestScore = Infinity;
  for (const pick of pool.recipes.concat(pool.foods)) {
    if (genIsDense(pick)) continue;
    /* HARD exclusion, not a penalty. A penalty still chose the tortilla that was
       already in Meal 1 and put a second 185 g of it in the same slot. */
    if (usedToday && usedToday[pick.kind + ":" + pick.id]) continue;
    /* the holding window applies here too. It was checked when filling slots but
       NOT when topping up, so a stir-fry that holds three days was being spread
       across six by the closing pass — the smoke test caught it. */
    if (dateStr && !genRecipeFitsDay(pick, dateStr, firstSeen || {})) continue;
    const score = genFitScore(pick, want);
    if (score < bestScore) { bestScore = score; best = pick; }
  }
  return best;
}
/* Last resort for a MINOR only, when the pool is exhausted and the day is still
   under target: grow a portion already on the plate toward its own cap. Growing
   a serving is honest — it is more of a meal they are already having — where a
   duplicate row is not. Returns the kcal it managed to add. */
function genGrowExisting(placed, gapKcal, want, maxStepKcal) {
  const order = placed.slice().sort((a, b) => {
    const pa = { kind: a.item.source === "recipe" ? "recipe" : "food", id: a.item.refId };
    const pb = { kind: b.item.source === "recipe" ? "recipe" : "food", id: b.item.refId };
    return genFitScore(pa, want) - genFitScore(pb, want);
  });
  for (const row of order) {
    const pick = { kind: row.item.source === "recipe" ? "recipe" : "food", id: row.item.refId };
    if (genIsDense(pick)) continue;
    const cap = genPortionCap(pick);
    const before = resolveItem(row.item);
    if (!before || !(before.macros.kcal > 0)) continue;
    if (row.item.servings != null) {
      /* the smallest possible step is a quarter serving — if even that blows
         past the caller's precision budget, this row cannot help, try the next
         (LL-634: the finishing pass needs steps smaller than the gap; the minor
         path passes no budget and keeps its overshoot-toward-safe behavior) */
      if (maxStepKcal && before.macros.kcal / row.item.servings * 0.25 > maxStepKcal) continue;
      const room = (cap.servings || 0) - row.item.servings;
      if (!(room >= 0.25)) continue;
      const add = Math.min(room, Math.max(0.25, Math.round(gapKcal / (before.macros.kcal / row.item.servings) * 4) / 4));
      row.item.servings = Math.round((row.item.servings + add) * 4) / 4;
    } else {
      const room = (cap.grams || 0) - row.item.grams;
      if (!(room >= 5)) continue;
      const per100 = before.macros.kcal / (row.item.grams / 100);
      if (maxStepKcal && per100 * 0.05 > maxStepKcal) continue;   // 5 g is the smallest step
      const add = Math.min(room, Math.max(5, Math.round(gapKcal / per100 * 100 / 5) * 5));
      row.item.grams = row.item.grams + add;
    }
    const after = resolveItem(row.item);
    return after ? after.macros.kcal - before.macros.kcal : 0;
  }
  return 0;
}

/* LL-634: the mirror of genGrowExisting, for a day the quarter-serving
   rounding of the slot fill left OVER target — which nothing ever corrected.
   Shrinks the row that best matches the SURPLUS macros, in quarter-serving /
   5 g steps, never below a quarter serving or 5 g, honoring the same
   precision budget as the grow. Adults only at the call site — a minor's day
   is never reduced. */
function genShrinkExisting(placed, overKcal, surplus, maxStepKcal) {
  const order = placed.slice().sort((a, b) => {
    const pa = { kind: a.item.source === "recipe" ? "recipe" : "food", id: a.item.refId };
    const pb = { kind: b.item.source === "recipe" ? "recipe" : "food", id: b.item.refId };
    return genFitScore(pa, surplus) - genFitScore(pb, surplus);
  });
  for (const row of order) {
    const pick = { kind: row.item.source === "recipe" ? "recipe" : "food", id: row.item.refId };
    if (genIsDense(pick)) continue;
    const before = resolveItem(row.item);
    if (!before || !(before.macros.kcal > 0)) continue;
    if (row.item.servings != null) {
      if (maxStepKcal && before.macros.kcal / row.item.servings * 0.25 > maxStepKcal) continue;
      const room = row.item.servings - 0.25;
      if (!(room >= 0.25)) continue;
      const drop = Math.min(room, Math.max(0.25, Math.round(overKcal / (before.macros.kcal / row.item.servings) * 4) / 4));
      row.item.servings = Math.round((row.item.servings - drop) * 4) / 4;
    } else {
      const per100 = before.macros.kcal / (row.item.grams / 100);
      if (maxStepKcal && per100 * 0.05 > maxStepKcal) continue;
      const room = row.item.grams - 5;
      if (!(room >= 5)) continue;
      const drop = Math.min(room, Math.max(5, Math.round(overKcal / per100 * 100 / 5) * 5));
      row.item.grams = row.item.grams - drop;
    }
    const after = resolveItem(row.item);
    return after ? before.macros.kcal - after.macros.kcal : 0;
  }
  return 0;
}

/* The macros of one unit of a pool item — 100 g of a food, one serving of a
   recipe. Selection compares RATIOS, so which unit it is does not matter. */
function genPerUnit(pick) {
  if (pick.kind === "food") {
    const f = S.foods[pick.id];
    return f ? { kcal: f.per100g.kcal, p: f.per100g.p, c: f.per100g.c, f: f.per100g.f } : null;
  }
  const r = S.recipes[pick.id]; if (!r) return null;
  const c = r.computed || computeRecipe(r).computed;
  return c.perServing && c.perServing.kcal > 0 ? c.perServing : (c.per100g && c.per100g.kcal > 0 ? c.per100g : null);
}
/* How badly a candidate fits what is LEFT of the day, in kcal of macro error
   per kcal eaten. Grams of error are multiplied back by their Atwater factors
   so protein, carb and fat error are commensurate rather than three numbers
   with different meanings being added together.

   This is the whole reason the generator is not just "divide the target by the
   number of meals". Filling on calories alone produced a week that hit 2,350
   kcal and 275 g of protein against a 200 g target — and for the minor, 410 g
   against 140. Calories were right and the plan was wrong. */
function genFitScore(pick, want) {
  const per = genPerUnit(pick);
  if (!per || !(per.kcal > 0)) return Infinity;
  if (!(want.kcal > 0)) return 0;
  const wp = Math.max(0, want.p) / want.kcal, wc = Math.max(0, want.c) / want.kcal, wf = Math.max(0, want.f) / want.kcal;
  return Math.abs(per.p / per.kcal - wp) * 4 +
         Math.abs(per.c / per.kcal - wc) * 4 +
         Math.abs(per.f / per.kcal - wf) * 9;
}

function generateWeek(p, weekId, opts) {
  opts = opts || {};
  const onlyEmpty = opts.onlyEmpty !== false;
  /* LL-644: an explicit date list plans exactly those days of this week —
     the day-count generator passes each week its own slice */
  const dates = (opts.dates && opts.dates.length) ? opts.dates : weekDates(weekId);
  const pool = genPool(p);
  if (!pool.recipes.length && !pool.foods.length) {
    return { ok: false, why: "There is nothing to build a week out of yet. Add a recipe on the Food tab, or star a few foods as favourites, and this can fill the week from them." };
  }
  const tg = p.targets;
  const firstSeen = {};                       // recipeId -> first date it was placed
  const useCount = {};                        // how often the week has leaned on each item
  const rows = [], days = [];
  let rotation = 0, skipped = 0;

  for (let di = 0; di < dates.length; di++) {
    const d = dates[di];
    const budgets = slotBudgets(p, d);
    /* The biggest slots are MEALS: a main plus something alongside it, which is
       both how people eat and the only way the fit can work. One item per slot
       cannot hit a macro ratio unless the pool happens to contain something at
       that exact ratio — a chicken recipe alone lands 3x over on protein no
       matter how the amount is scaled. Splitting the slot 60/40 gives the
       selection a second degree of freedom, and the second piece is chosen
       against what the first one left. */
    const order = budgets.map((b, i) => i).sort((a, b) => budgets[b].kcal - budgets[a].kcal);
    const isBig = {};
    order.forEach((idx, rank) => { isBig[idx] = rank < Math.max(1, Math.ceil(budgets.length / 2)); });

    const usedToday = {};
    const placed = [];
    /* what the WHOLE day still needs, drained as each slot is filled. Selection
       matches against this, so a day that has already taken its protein starts
       preferring carbs on its own. */
    const want = { kcal: tg.kcal || 0, p: tg.protein || 0, c: tg.carbs || 0, f: tg.fat || 0 };
    for (let si = 0; si < budgets.length; si++) {
      const b = budgets[si];
      if (!(b.kcal > 0)) continue;
      if (onlyEmpty && plannedItems(p, d, b.slot.id).length) { skipped++; continue; }
      const all = pool.recipes.concat(pool.foods);
      const twoPiece = isBig[si] && pool.recipes.length > 0 && pool.foods.length > 0;
      let left = b.kcal;
      for (let piece = 0; piece < (twoPiece ? 2 : 1); piece++) {
        /* HOW BIG THE MAIN IS, is itself a calculation. A fixed 60/40 split
           still lands 80% over on protein when the main is three times as
           protein-dense as the day wants — which is exactly what a chicken
           recipe is against a 15-year-old's 140 g target. So the main gets the
           share its own density earns: the day wants 0.038 g of protein per
           kcal, the recipe carries 0.10, so the recipe takes 38% of the slot
           and what goes alongside it takes the rest. Bounded at 25% and 80% so
           a meal never becomes a garnish or swallows the plate. */
        let share = left;
        if (twoPiece && piece === 0) share = left * 0.6;
        if (!(share > 0)) continue;
        const leads = !twoPiece || piece === 0;      // is this the meal, or what goes with it
        let pick = null, best = Infinity;
        for (const cand of all) {
          if (usedToday[cand.kind + ":" + cand.id]) continue;
          if (leads && genIsDense(cand)) continue;    // oil, honey, syrup, hard cheese: never the meal
          if (!genRecipeFitsDay(cand, d, firstSeen)) continue;
          /* a light nudge away from whatever the week has leaned on already, so
             seven days do not come out identical. Small enough that it never
             beats a genuinely better macro fit. A recipe is PREFERRED as the
             main of a big slot, but only preferred — the fit still decides. */
          const seen = (useCount[cand.kind + ":" + cand.id] || 0);
          let score = genFitScore(cand, want) * (1 + 0.12 * seen);
          if (twoPiece && piece === 0) score *= (cand.kind === "recipe" ? 0.8 : 1.25);
          if (score < best) { best = score; pick = cand; }
        }
        if (!pick) {
          /* Every candidate is already on today's plate — a seven-meal day will
             exhaust a small pool before it is full. Repeat something rather than
             leave a slot empty, but repeat the thing that FITS: falling back to
             a blind rotation put a second 185 g of tortilla on the same day as
             the first while better options sat unused. */
          for (const cand of all) {
            if (leads && genIsDense(cand)) continue;
            if (!genRecipeFitsDay(cand, d, firstSeen)) continue;
            const score = genFitScore(cand, want) * (1 + 0.12 * (useCount[cand.kind + ":" + cand.id] || 0));
            if (score < best) { best = score; pick = cand; }
          }
        }
        if (!pick) continue;
        if (twoPiece && piece === 0) {
          const per = genPerUnit(pick);
          const wantRatio = want.kcal > 0 ? Math.max(0, want.p) / want.kcal : 0;
          const haveRatio = per && per.kcal > 0 ? per.p / per.kcal : 0;
          const earned = haveRatio > 0 && wantRatio > 0 ? wantRatio / haveRatio : 0.6;
          share = left * Math.min(0.8, Math.max(0.25, earned));
        }
        rotation++;
        const item = genAmountFor(pick, share);
        if (!item) continue;
        /* a capped portion cannot reach its share, so what it did not take rolls
           on to the next piece rather than quietly vanishing out of the day */
        const took = resolveItem(item);
        left -= took ? Math.min(share, took.macros.kcal) : share;
        const got = resolveItem(item);
        if (got) { want.kcal -= got.macros.kcal; want.p -= got.macros.p; want.c -= got.macros.c; want.f -= got.macros.f; }
        usedToday[pick.kind + ":" + pick.id] = true;
        useCount[pick.kind + ":" + pick.id] = (useCount[pick.kind + ":" + pick.id] || 0) + 1;
        if (pick.kind === "recipe" && !firstSeen[pick.id]) firstSeen[pick.id] = d;
        const row = { date: d, slotId: b.slot.id, slotName: b.slot.name, item, name: pick.name, budget: share };
        rows.push(row); placed.push(row);
      }
    }

    /* --- close the day ---
       Whatever the slots left on the table, filled with whatever best matches
       the macros still missing, one portion at a time and never more than three
       extra rows. Bounded because a loop that keeps adding until the numbers are
       perfect will happily plan eleven things nobody is going to eat.

       A MINOR IS NEVER LEFT SHORT. Spec §5 and Panel §2: a minor's profile
       cannot enter a deficit, and a generator that under-fills the day is a
       deficit however it got there — so for a minor the day closes on kcal even
       if the macro split has to give. */
    if (placed.length) {
      const dayTotal = () => {
        const t = ZERO();
        for (const r of placed) { const rr = resolveItem(r.item); if (rr) addTo(t, rr.macros); }
        return t;
      };
      /* Spread the extras rather than stacking them on whatever slot happened to
         be last. Three top-ups all landing on "Before bed" is 846 kcal at
         bedtime, which is not what anyone meant by filling the week. */
      const roomy = placed.slice().sort((a, b) => b.budget - a.budget);
      const host = i => roomy.length ? roomy[i % roomy.length] : placed[placed.length - 1];
      for (let pass = 0; pass < 8; pass++) {
        const t = dayTotal();
        const kcalBefore = t.kcal;
        const gapK = (tg.kcal || 0) - t.kcal;
        const gapP = (tg.protein || 0) - t.p;
        /* A MINOR'S DAY REACHES TARGET. Not "close to target" — spec §5 and
           Panel §2 say the profile cannot enter a deficit, and a tolerance band
           is a deficit with a nicer name. An earlier version allowed 1.5% and
           produced three days a few calories under target; the smoke
           test for this catches exactly that. What the tolerance was trying to
           fix is fixed below instead, by GROWING a portion rather than adding
           another protein source. */
        /* CALORIES ARE THE STOP CONDITION, for everyone. Topping up because
           protein was short while calories were already on target is how a
           Sunday ended up 184 kcal over having added a Carb Balance tortilla
           and then an apple — the second of which carries no protein at all.
           A protein gap the pool cannot close is reported in the warnings
           instead of eaten around. */
        const worthIt = p.isMinor ? gapK > 0 : gapK > (tg.kcal || 0) * 0.04;
        if (!worthIt) break;
        const need = { kcal: Math.max(gapK, 0), p: Math.max(gapP, 0),
                       c: Math.max((tg.carbs || 0) - t.c, 0), f: Math.max((tg.fat || 0) - t.f, 0) };
        if (!(need.kcal > 0)) need.kcal = Math.max(gapP, 0) * 4;
        /* Already past the protein target? Then MORE of something on the plate
           beats a new row: adding is how the day gets another protein source it
           did not need, growing is just a bigger helping of the carbs it did. */
        if (gapK > 0 && t.p > (tg.protein || 0) * 1.05 && genGrowExisting(placed, gapK, need) > 0) continue;
        const pick = genTopUpPick(pool, need, usedToday, d, firstSeen);
        if (!pick) {
          if (gapK > 0 && genGrowExisting(placed, gapK, need) > 0) continue;
          break;
        }
        const item = genAmountFor(pick, need.kcal);
        if (!item) break;
        const got = resolveItem(item);
        if (!got || !(got.macros.kcal > 0)) break;
        /* The smallest portion of the best-fitting thing can still be far bigger
           than the hole it is filling — a quarter serving is a quarter serving.
           Adding it anyway put a Sunday 184 kcal over target. An adult simply
           does not get that row; the day is a little under and that is the
           better answer — the finishing pass below closes the gap in small
           steps instead. The bound is absolute (2.5% of the day) rather than
           relative to the gap, because 1.6x of a big gap landed a day 3.6%
           over — past the 3% the lands-on-calories spec allows. A MINOR still
           gets the row, because for a minor "a little under" is a deficit and
           overshooting is the safe direction. */
        if (!p.isMinor && got.macros.kcal > need.kcal + (tg.kcal || 0) * 0.025) break;
        usedToday[pick.kind + ":" + pick.id] = true;
        useCount[pick.kind + ":" + pick.id] = (useCount[pick.kind + ":" + pick.id] || 0) + 1;
        if (pick.kind === "recipe" && !firstSeen[pick.id]) firstSeen[pick.id] = d;
        const at = host(pass);
        const row = { date: d, slotId: at.slotId, slotName: at.slotName, item,
                      name: pick.name, budget: 0, topUp: true };
        rows.push(row); placed.push(row);
        /* nothing moved: the pool is exhausted and every portion is at its cap.
           Stop rather than spin — the preview will show the day short and say so. */
        if (dayTotal().kcal <= kcalBefore + 0.5) break;
      }
      /* --- finish the day (LL-634) ---
         The add-a-row loop above stops for an adult once the gap is under 4%,
         because a new ROW that small overshoots. But the spec for this screen
         is "lands on calories, every day" at 3% — and with a wider recipe bank
         the pool can now leave a day in the 3–4% crack the old bank never hit.
         Growing a portion already on the plate closes it in 5 g / quarter-serving
         steps without adding anything new. Minors were never allowed the gap. */
      if (!p.isMinor) {
        for (let pass = 0; pass < 6; pass++) {
          const t = dayTotal();
          const gapK = (tg.kcal || 0) - t.kcal;      // positive = under target
          if (Math.abs(gapK) <= (tg.kcal || 0) * 0.015) break;
          if (gapK > 0) {
            const need = { kcal: gapK, p: Math.max((tg.protein || 0) - t.p, 0),
                           c: Math.max((tg.carbs || 0) - t.c, 0), f: Math.max((tg.fat || 0) - t.f, 0) };
            /* precision budget: a step may not blow past the target by more
               than the gap itself allows — steps bigger than 1.6x the gap are
               how the day got over target in the first place */
            if (!(genGrowExisting(placed, gapK, need, gapK * 1.6) > 0)) break;
          } else {
            const over = -gapK;
            const surplus = { kcal: over, p: Math.max(t.p - (tg.protein || 0), 0),
                              c: Math.max(t.c - (tg.carbs || 0), 0), f: Math.max(t.f - (tg.fat || 0), 0) };
            if (!(genShrinkExisting(placed, over, surplus, over * 1.6) > 0)) break;
          }
        }
      }
    }

    const t = ZERO(); const confs = []; let fiberComplete = true;
    for (const r of placed) {
      const rr = resolveItem(r.item);
      if (!rr) continue;
      addTo(t, rr.macros); confs.push(rr.confidence);

/* The one place a file leaves the app. Used by the JSON export too. */
function downloadFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function shoppingFor() {
  const names = Object.values(S.profiles).map(pr => pr.name);
  return names.length ? names.join(" + ") : "nobody set up yet";
}

/* ---- protein sanity check (LL-204) -------------------------
   Instructions §8: total the protein weight at the bottom as a check against
   the week's combined protein. This is the line that catches a dropped item —
   if the cart is 15% light, something fell off the list.

   Cart protein uses the FULL quantity, before the pantry is subtracted,
   because the check is "does this much food carry the week's protein",
   not "how much am I buying today". That is also how the worked example in
   docs/03_WEEK_01.md computes it.
   ------------------------------------------------------------ */
function cartProtein(weekId) {
  const list = S.grocery[weekId] || [];
  let grams = 0; const confs = [];
  for (const l of list) {
    if (l.removed) continue;
    const f = S.foods[l.foodId];
    if (!f) continue;
    grams += (l.rawG || 0) * f.per100g.p / 100;
    confs.push(f.confidence);
  }
  return { grams, confidence: confs.length ? weakest(confs) : "unknown" };
}
/* What the week's meals actually call for, both profiles — over the same days
   the cart is shopped for (LL-645), or the variance would compare a
   remaining-days cart against a whole-week requirement and read falsely light. */
function weekPlannedProtein(weekId) {
  let grams = 0;
  for (const p of Object.values(S.profiles))
    for (const d of shopDates(weekId)) grams += dayPlanTotals(p, d).t.p;
  return grams;
}
function proteinCheck(weekId) {
  const cart = cartProtein(weekId), need = weekPlannedProtein(weekId);
  return {
    cart: cart.grams, need, confidence: cart.confidence,
    variancePct: need > 0 ? (cart.grams - need) / need * 100 : null
  };
}

/* ---- two-tortilla guard (LL-205) ---------------------------
   03_WEEK_01: two kinds of tortilla in the house, same shelf, different bag.
   the adult's Carb Balance cut calories, which is the last thing the minor needs.
   Swapping the bags moves the two of them in OPPOSITE directions, so the
   grocery line has to say whose is whose.

   The consequence is computed, not quoted: each tortilla a profile eats is
   priced against the same-size tortilla of the other type.
   ------------------------------------------------------------ */
function tortillaCounterpart(foodId) {
  const f = S.foods[foodId];
  if (!f || !f.tortilla) return null;
  const cands = Object.values(S.foods).filter(o =>
    o.tortilla && o.id !== foodId && o.tortilla.size === f.tortilla.size &&
    o.tortilla.carbBalance !== f.tortilla.carbBalance);
  if (!cands.length) return null;
  return cands.find(o => o.__assigned) || cands[0];
}
function kcalPerTortilla(f) {
  const g = f.countUnit ? f.countUnit.grams : 0;
  return g > 0 ? g * f.per100g.kcal / 100 : 0;
}
function tortillaGuard(weekId) {
  const dates = weekDates(weekId);
  const owners = {};                       // foodId -> { pids:Set, count }
  for (const p of Object.values(S.profiles))
    for (const d of dates)
      for (const s of p.slots)
        for (const it of plannedItems(p, d, s.id)) {
          /* a tortilla can arrive directly, or folded inside a recipe — the car
             burrito is a Carb Balance fajita and it counts just the same */
          const bits = [];
          if (it.source === "food") bits.push([it.refId, it.grams || 0]);
          else {
            const r = S.recipes[it.refId];
            const n = servingsOfItem(it);
            if (r && r.servings && n > 0)
              for (const ing of r.ingredients) bits.push([ing.foodId, ing.rawGrams * n / r.servings]);
          }
          for (const [fid, grams] of bits) {
            const f = S.foods[fid];
            if (!f || !f.tortilla || !f.countUnit || !(grams > 0)) continue;
            const o = owners[fid] = owners[fid] || { foodId: fid, pids: {}, count: 0 };
            const c = grams / f.countUnit.grams;
            o.pids[p.id] = (o.pids[p.id] || 0) + c;
            o.count += c;
          }
        }
  const foodIds = Object.keys(owners);
  if (foodIds.length < 2) return null;

  /* A guard only when the profiles are on genuinely different PRODUCTS —
     Carb Balance versus standard. the adult eating both a 10" and a 6" of the
     same line is not a swap risk; two different bags on one shelf is. */
  const typesFor = pid => {
    const t = new Set();
    for (const id of foodIds)
      if (owners[id].pids[pid] > 0) t.add(S.foods[id].tortilla.carbBalance ? "cb" : "std");
    return [...t].sort().join("+");
  };
  const perProfileTypes = Object.keys(S.profiles).map(typesFor).filter(Boolean);
  if (new Set(perProfileTypes).size < 2) return null;

  foodIds.forEach(id => { S.foods[id].__assigned = true; });
  const perProfile = {};
  for (const id of foodIds) {
    const other = tortillaCounterpart(id);
    if (!other) continue;
    const delta = kcalPerTortilla(other) - kcalPerTortilla(S.foods[id]);
    for (const [pid, n] of Object.entries(owners[id].pids))
      perProfile[pid] = (perProfile[pid] || 0) + delta * n / 7;      // per day
  }
  foodIds.forEach(id => { delete S.foods[id].__assigned; });

  const bits = Object.entries(perProfile)
    .filter(([, v]) => Math.abs(v) >= 1)
    .map(([pid, v]) => (S.profiles[pid] ? S.profiles[pid].name : pid) + " " +
      (v > 0 ? "+" : "−") + R(Math.abs(v)) + " kcal a day");
  const signs = new Set(Object.values(perProfile).filter(v => Math.abs(v) >= 1).map(v => v > 0 ? 1 : -1));
  const consequence = bits.length
    ? "Swap the bags and it is " + bits.join(", ") + (signs.size > 1 ? " — in opposite directions." : ".")
    : null;

  const owner = {};
  for (const id of foodIds) {
    owner[id] = Object.keys(owners[id].pids).map(pid => S.profiles[pid] ? S.profiles[pid].name : pid);
  }
  return { owner, consequence };
}

function groceryLine(weekId, key) {
  /* LL-637: hand-added lines are keyed by lineId; plan lines by foodId */
  return (S.grocery[weekId] || []).find(l => l.lineId === key || (!l.lineId && l.foodId === key)) || null;
}
/* LL-637. The shop includes things no macro tracks — soda, water, paper towels —
   and extras beyond the plan. A hand-added line: from the library at grams, or
   free text with whatever quantity words mean something ("2 cases"). It survives
   regeneration untouched, because the plan did not put it there and the plan
   cannot take it away. No pantry subtraction either — a hand-added line means
   "buy this", not "buy what's left of this". */
function addManualFood(weekId, foodId, grams) {
  const f = S.foods[foodId];
  if (!f || !(grams > 0)) return null;
  if (!S.grocery[weekId]) generateGrocery(weekId);
  const base = groceryLineFor(foodId, grams, weekId);
  const l = Object.assign(base, { lineId: uid("gl"), manual: true, haveG: 0, needG: grams, have: false, purchaseUnit: purchaseUnitFor(f, grams) });
  S.grocery[weekId].push(l);
  save();
  return l;
}
function addManualText(weekId, name, qtyText) {
  name = (name || "").trim();
  if (!name) return null;
  if (!S.grocery[weekId]) generateGrocery(weekId);
  const l = {
    lineId: uid("gl"), manual: true, foodId: null, name, aisle: "Other", store: DEFAULT_STORE,
    rawG: 0, haveG: 0, needG: 1, qtyText: (qtyText || "").trim() || null,
    purchaseUnit: null, have: false, checked: false, perishBy: null, removed: false
  };
  S.grocery[weekId].push(l);
  save();
  return l;
}
function removeManualLine(weekId, lineId) {
  const l = groceryLine(weekId, lineId);
  if (!l || !l.manual) return false;
  l.removed = true;            // kept, not deleted — the list may already be in a pocket
  save();
  return true;
}
/* What to print beside a line's name: grams for anything weighed, the user's
   own words for a free-text line, nothing when there is nothing to say. */
function groceryQty(l) {
  if (l.qtyText) return l.qtyText;
  if (l.foodId) return num(l.needG) + " g";
  return "";
}
/* "Checking an item optionally writes it to pantry" — optionally, so it is a
   separate deliberate tap, never a side effect of ticking the box. */
function stockPantry(foodId, grams) {
  if (!(grams > 0)) return;
  S.pantry[foodId] = { grams, updatedAt: isoDate() };
  save();
}
function toggleGroceryCheck(weekId, foodId) {
  const l = groceryLine(weekId, foodId);
  if (!l) return;
  l.checked = !l.checked;
  save();
}

function snapshotPlans(label) {
  UI.undo = { label, plans: JSON.parse(JSON.stringify(S.plans)) };
}
function undoPlans() {
  if (!UI.undo) return null;
  const label = UI.undo.label;
  S.plans = UI.undo.plans;
  UI.undo = null;

}
function copyDay(fromPid, fromDate, toPid, toDates) {
  const fromP = S.profiles[fromPid];
  const rows = effectiveDay(fromP, fromDate);
  snapshotPlans("Copy of " + fmtDate(fromDate));
  let copied = 0, dropped = 0, days = 0;
  for (const d of toDates) {
    if (d === fromDate && toPid === fromPid) continue;
    const r = writeDay(fromP, toPid, d, rows);
    copied += r.copied; dropped += r.dropped; days++;
  }
  save();
  return { days, copied, dropped };
}
function copyWeek(fromPid, weekId, toPid) {
  const fromP = S.profiles[fromPid];
  const dates = weekDates(weekId);
  const rows = dates.map(d => effectiveDay(fromP, d));
  snapshotPlans("Copy of the week of " + weekLabel(weekId));
  let copied = 0, dropped = 0;
  dates.forEach((d, i) => {
    const r = writeDay(fromP, toPid, shiftDate(d, 7), rows[i]);
    copied += r.copied; dropped += r.dropped;
  });
  save();
  return { days: 7, copied, dropped, target: shiftDate(weekId, 7) };
}
function logsFor(pid, dateStr) {
  S.logs[pid] = S.logs[pid] || {};
  S.logs[pid][dateStr] = S.logs[pid][dateStr] || [];
  return S.logs[pid][dateStr];
}
function dayTotals(pid, dateStr) {
  const t = ZERO(); const confs = []; let fiberComplete = true;
  for (const e of logsFor(pid, dateStr)) {
    addTo(t, e.macros); confs.push(e.confidence);
    if (e.fiberKnown === false) fiberComplete = false;
  }
  return { t, confidence: confs.length ? weakest(confs) : "verified", fiberComplete, count: confs.length };
}

/* ============================================================
   5. APP STATE + BOOT
   ============================================================ */
let S = null;
const UI = {
  tab: "today", foodTab: "log", date: isoDate(), search: "", estimate: false, animated: false,
  weekStart: null, planPid: null, planScrollL: 0, planScrollT: 0, cellQ: "", undo: null,
  genOnlyEmpty: true,
  distress: false, onb: null,
  /* Testing FIX 9b. Session-only on purpose: it is never written to storage,
     so it cannot follow anyone across days and become a nag. */
  writes: 0, exportOffer: false, exportDone: false
};
const EXPORT_AFTER = 15;   // entries in one sitting before the offer appears, once
function noteWrite(n) {
  if (UI.exportDone) return;
  UI.writes += (n || 1);
  if (UI.writes >= EXPORT_AFTER) UI.exportOffer = true;
}

/* Read a slot, parse it, migrate it. Returns null if it is unusable. */
function readSlot(raw) {
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    if (!looksLikeState(parsed)) return null;
    return migrate(parsed);
  } catch (e) { return null; }
}
/* A truncated write parses as garbage or not at all. Either way the previous
   good copy in :bak has to be tried BEFORE falling back to a fresh seed —
   seeding over a recoverable backup would silently destroy the log. */
function looksLikeState(o) {
  return !!o && typeof o === "object" && o.profiles && typeof o.profiles === "object" &&
    Object.keys(o.profiles).length > 0 && o.logs && typeof o.logs === "object";
}

async function boot() {
  Store = await makeStore();
  let loaded = readSlot(await Store.get(KEY));
  let recovered = false;
  if (!loaded) { loaded = readSlot(await Store.get(BAK)); recovered = !!loaded; }
  S = loaded || seedState();
  if (recovered) setTimeout(() => toast("Recovered the previous saved copy"), 400);
  if (needsOnboarding()) UI.onb = onbDefaults();
  Object.values(S.recipes).forEach(r => computeRecipe(r));
  if (!loaded) save();
  render();
  requestAnimationFrame(() => { UI.animated = true; document.body.classList.add("anim"); });
}

/* ============================================================
   6. RENDER
   ============================================================ */
function render() {
  /* A brand-new install has NOBODY in it — the installable build seeds no
     person at all. Everything below this point assumes a profile exists, so
     the empty case is handled first rather than crashing into a white screen. */
  const p = profile() || null;
  document.documentElement.dataset.accent = p ? p.accent : "amber";
  document.documentElement.dataset.theme = S.settings.theme === "light" ? "light" : "dark";
  document.documentElement.style.setProperty("--scale", S.settings.textScale);
  el("chipName").textContent = p ? p.name.toUpperCase() : "SETUP";
  el("hdate").textContent = fmtDate(UI.date);
  document.querySelectorAll("nav button[data-tab]").forEach(b => {
    if (b.dataset.tab === UI.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const app = el("app");
  app.className = UI.tab === "today" ? "screen-today" : "";
  if (!UI.onb && !p) UI.onb = onbDefaults();     // nobody here: there is nothing else to show
  if (UI.onb) {
    document.body.classList.add("onbmode");
    app.className = "";
    app.innerHTML = viewStorageWarning() + viewOnboarding();
    return;
  }
  document.body.classList.remove("onbmode");
  app.innerHTML = viewStorageWarning() + viewExportOffer() + (
    UI.tab === "today" ? viewToday(p) :
    UI.tab === "food" ? viewFood(p) :
    UI.tab === "plan" ? viewPlan() :
    UI.tab === "grocery" ? viewGrocery() :
    UI.tab === "settings" ? viewSettings() :
    UI.tab === "train" ? viewTrain(p) :
    viewProgress(p));
  if (UI.tab === "today" && UI.animated) requestAnimationFrame(paintGauges);
  else if (UI.tab === "today") paintGauges();
  if (UI.tab === "plan") restorePlanScroll();
}

/* Switching the profile tab rebuilds the grid; the position in a 7-day

function viewStub(name, stage, what) {
